    +`<div class="pr-row"><span class="pr-lbl">Показы</span><span class="pr-fact">${totalShows>0?Fk(totalShows):'—'}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Корзина</span><span class="pr-fact">${totalCart>0?Nf(totalCart):'—'}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Заказы</span><span class="pr-fact">${totalOrders>0?Nf(totalOrders):'—'}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Отменено</span><span class="pr-fact">${cancelled>0?Nf(cancelled):'—'}</span></div>`
    +'</div>';
}
function heatCls(v,metric,mn,mx){
  if(v===0)return'';
  const pos=(v-mn)/(mx-mn||1);
  const inv=metric==='drr'||metric==='commPct'||metric==='logiPct';
  if(inv)return pos>.66?'h3r':pos>.33?'h2r':'h1r';
  return pos>.66?'h3g':pos>.33?'h2g':'h1g';
}
function sparkSVG(vals,color,w=48,h=20){
  const nz=vals.filter(v=>v>0);
  if(!nz.length)return`<svg width="${w}" height="${h}"></svg>`;
  const mn=Math.min(...nz),mx=Math.max(...nz),rng=mx-mn||1;
  const pts=vals.map((v,i)=>[2+i/(vals.length-1||1)*(w-4),v===0?h/2:h-2-(v-mn)/rng*(h-5)]);
  const act=vals.map(v=>v>0);
  let path='';
  pts.forEach((p,i)=>{
    if(!act[i])return;
    const prev=pts.slice(0,i).filter((_,j)=>act[j]).slice(-1)[0];
    path+=prev?`L${p[0].toFixed(1)},${p[1].toFixed(1)}`:`M${p[0].toFixed(1)},${p[1].toFixed(1)}`;
  });
  const lp=pts.filter((_,i)=>act[i]).slice(-1)[0];
  return`<svg width="${w}" height="${h}" style="display:block"><path d="${path}" fill="none" stroke="${color}" stroke-width="1.5"/>${lp?`<circle cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="2" fill="${color}"/>`:''}
  </svg>`;
}

// ─── Режим "Все": под-строки по метрикам вместо блока подписей в каждом дне ──
// Один и тот же список полей, что раньше рисовал dayAllHTML() построчно внутри
// каждой ячейки-дня — теперь название метрики живёт ОДИН раз слева (статичная
// колонка s1), накопительный итог — там же (s2), а в колонках дней — голое число.
// gk — короткий ключ группы, нужен только для фонового цвета блока (см. .mgroup-* CSS
// ниже) — отдельно от grp (текст заголовка-разделителя, показывается один раз на группу).
// planKey(p) — p это агрегат плана {ord,buy,rev,spend,comm,logi,np} (см.
// buildPlanAgg()) — возвращает ПОЛНЫЙ МЕСЯЧНЫЙ план для этой метрики, откуда
// staticLabelBlockHTML прорейтивает "план на сегодня" сам (см. lastDataDay/
// daysInMonth там). Только у метрик, где план реально есть — 24.09.2026.
const METRIC_ROWS=[
  {key:'ord',      label:'Заказы',   fmt:'int', gk:'core', planKey:p=>p.ord},
  {key:'sls',      label:'Продажи',  fmt:'int', gk:'core', planKey:p=>p.buy},
  {key:'buyoutPct',label:'Выкуп %',  fmt:'pct', gk:'core', planKey:p=>p.ord>0?p.buy/p.ord*100:null, planIsRatio:true},
  {key:'rev',      label:'Выручка',  fmt:'money', gk:'core', planKey:p=>p.rev},
  {key:'ret',      label:'Возврат',  fmt:'money', pct:true, gk:'core'},
  {key:'avg',      label:'Ср. чек',  fmt:'money', gk:'core'},
  {key:'np',       label:'ЧП',       fmt:'money', pct:true, pctSign:true, gk:'core', planKey:p=>p.np},
  {key:'spend',    label:'ДРР',      fmt:'money', pct:true, gk:'core', planKey:p=>p.spend},
  {key:'comm',     label:'Комиссия', fmt:'money', pct:true, gk:'core', planKey:p=>p.comm},
  {key:'acq',      label:'Эквайринг',fmt:'money', pct:true, gk:'core'},
  {key:'logi',     label:'Логистика',fmt:'money', pct:true, gk:'core', planKey:p=>p.logi},
  {key:'adShows',  label:'Показы',   fmt:'k', grp:'Реклама', gk:'ads'},
  {key:'adClicks', label:'Клики',    fmt:'int', gk:'ads'},
  {key:'adCart',   label:'Корзина',  fmt:'int', gk:'ads'},
  {key:'adOrders', label:'Заказы',   fmt:'int', gk:'ads'},
  {key:'totalShows', label:'Показы',  fmt:'k', grp:'Итого (реклама+органика)', gk:'total'},
  {key:'totalCart',  label:'Корзина', fmt:'int', gk:'total'},
  {key:'totalOrders',label:'Заказы',  fmt:'int', gk:'total'},
  {key:'cancelled',  label:'Отменено',fmt:'int', gk:'total'},
  // Остаток на складах — снэпшот НА дату, не поток за день. cumMode:'last' — в левой
  // накопительной колонке показываем последний известный остаток за период, а не сумму
  // остатков по дням (та была бы бессмысленной, см. metricCumValue).
  {key:'stockQty',   label:'Остатки', fmt:'int', grp:'Склад', gk:'stock', cumMode:'last'},
];
// o — объект вида gateDay(): {ord,sls,rev,ret,spend,comm,logi,acq,cogs,ftrev,mrev,adShows,adClicks,adCart,adOrders,totalShows,totalCart,totalOrders}
function metricVal(o,key){
  if(!o)return null;
  if(key==='avg')return o.sls>0?o.rev/o.sls:null;
  // Выкуп % = Продажи/Заказы. При чистом возврате (sls<0, см. коммент ниже) — "—",
  // не 0%, иначе выглядит как "заказали, но ничего не выкупили", хотя причина другая.
  if(key==='buyoutPct')return (o.ord>0&&o.sls>=0)?o.sls/o.ord*100:null;
  if(key==='np'){
    if(!(o.rev>0)||!(o.cogs>0))return null;
    return o.rev-o.cogs-o.spend-o.comm-o.logi-o.acq;
  }
  // Продажи/Выручка иногда уходят в минус в день/неделю ЧИСТОГО возврата (без своей
  // продажи в этом же периоде) — это честный побочный эффект формулы нетто
  // (confirmed_qty/confirmed_sum считают Продажа−Возврат вместе), не ошибка загрузки.
  // Сам возврат уже отдельно и явно виден в строке "Возврат" — тут гасим до "—",
  // чтобы голый "-1"/"-4183₽" в Продажах/Выручке не читался как сбой (реальный
  // фидбек: выглядело "как будто данные не подгрузились").
  if((key==='sls'||key==='rev')&&o[key]<0)return null;
  return o[key];
}
function fmtMetric(v,fmt){
  if(v===null||v===undefined||v===0)return'—';
  if(fmt==='money')return Nf(v)+'₽';
  if(fmt==='k')return v>0?Fk(v):Nf(v);
  if(fmt==='pct')return v.toFixed(1)+'%';
  return Nf(v);
}

// Агрегат плана по списку артикулов — единая функция для строки артикула
// (передать [art]), категории (arts) и общего итога (displayArts). Комиссия/
// логистика/ЧП считаются из %% плана (art.plan_comm_pct/plan_logi_pct,
// migration_plan_pct_fields.sql) × план-выручка — та же формула, что уже
// в mkPR-блоке артикула/категории (см. planComm/catPlanComm), продублирована
// сюда, т.к. нужна ещё и для METRIC_ROWS-блока (staticLabelBlockHTML/
// compactDayValuesHTML), у которого свой, отдельный путь рендера. 24.09.2026.
function buildPlanAgg(artsList){
  const p={ord:0,buy:0,rev:0,spend:0,comm:0,logi:0,vcTotal:0};
  for(const a of artsList){
    p.ord+=a.plan_ord||0;
    p.buy+=a.plan_buy||0;
    p.rev+=a.plan_rev||0;
    p.spend+=a.plan_spend||0;
    if(a.plan_rev>0&&a.plan_comm_pct>0)p.comm+=a.plan_rev*a.plan_comm_pct/100;
    if(a.plan_rev>0&&a.plan_logi_pct>0)p.logi+=a.plan_rev*a.plan_logi_pct/100;
    p.vcTotal+=(a.plan_vc||0)*(a.plan_buy||0);
  }
  p.np = p.rev>0 ? p.rev - p.vcTotal - p.spend - p.comm - p.logi : null;
  return p;
}

// Строка "факт / план [%]" для колонки s2 (plan-col) — общая для строки
// артикула И строки категории (24.09.2026: раньше жила только внутри
// per-артикульного цикла, категориям план вообще не показывался).
function mkPR(lbl, fact, plan, fmt) {
  const f = fmt(fact);
  if (!fact && !plan) return '';
  const pct = plan > 0 ? Math.round(fact / plan * 100) : null;
  const cls = pct === null ? '' : pct >= 100 ? 'pv' : pct >= 70 ? 'nw' : 'nv';
  const planPart = plan
    ? `<span class="pr-sep">/</span><span class="pr-plan">${fmt(plan)}</span><span class="pr-pct ${cls}">${pct}%</span>`
    : '';
  return `<div class="pr-row"><span class="pr-lbl">${lbl}</span><span class="pr-fact">${f}</span>${planPart}</div>`;
}
// % от выручки (той же базы, что раньше использовал dayAllHTML: ftrev дня, а если его
// нет — mrev, месячная выручка артикула, как fallback — см. коммент у gateDay в v6_live).
function metricPct(o,key,fmtDef){
  if(!o||!fmtDef.pct)return null;
  const v=metricVal(o,key);
  if(v===null||v===0)return null;
  const base=o.ftrev>0?o.ftrev:(o.mrev||0);
  if(!(base>0))return null;
  return Math.abs(v)/base*100;
}
// Всегда оборачиваем в .mline-badge (даже пустую) — своя grid-колонка (см.
// .mline CSS), иначе у строк без бейджа план/откл. сдвигались бы влево
// относительно строк с бейджем (нашли по фидбеку пользователя 25.09.2026).
function pctBadgeHTML(pct,v,fmtDef){
  if(pct===null)return'<span class="mline-badge"></span>';
  const bad=fmtDef.pctSign?v<0:false;
  const style=fmtDef.pctSign
    ?`background:${bad?'var(--color-background-danger)':'var(--color-background-success)'};color:${bad?'var(--color-text-danger)':'var(--color-text-success)'}`
    :`background:var(--color-background-warning);color:var(--color-text-warning)`;
  return`<span class="mline-badge"><span class="pr-pct" style="${style}">${pct.toFixed(1)}%</span></span>`;
}
// Правка после реального фидбека: НЕ отдельные строки-метрики под артикулом (это было
// дублированием — та же информация уже в статичном блоке s2, просто ещё раз ниже).
// Вместо этого — ОДНА строка на артикул/категорию/итого, как и было изначально:
//   s2 (статичная колонка, СПРАВА от фото+названия+комментария) — единственное место,
//   где живут подписи метрик, plus последний факт/накопительный итог.
//   ячейки дней — та же выборка метрик, тот же порядок, но БЕЗ подписей (только числа
//   и % бейджи) — порядок совпадает с s2, так что визуально дополняет её, не повторяет.
//
// dayArr — массив длиной days.length, элемент = gateDay(...) объект или null (выходной/нет данных)
// cumO — объект того же вида, накопленный итог за видимый период
function metricCumValue(dayArr,cumO,m){
  // Остаток — снэпшот, не поток: "накопительный итог" по нему считать нельзя (сумма
  // остатков по дням периода — бессмысленное число). Вместо суммы (cumO) берём
  // последнее известное значение за видимый период — то, что реально на складе сейчас.
  if(m.cumMode==='last'){
    const found=dayArr.slice().reverse().find(o=>o&&o[m.key]!==undefined);
    return found?found[m.key]:null;
  }
  return metricVal(cumO,m.key);
}
// Полный подписанный блок — идёт в s2 (справа от фото/названия/комментария) в режиме "Все".
// ВАЖНО: строки тут (.mrow/.msep) — те же классы с ЖЁСТКО зафиксированной высотой, что
// использует compactDayValuesHTML() ниже, специально НЕ переиспользуем .pr-row/.pr-wrap
// (те применяются ещё и в других местах со своими per-context переопределениями
// font-size/gap — из-за этого высота строки в s2 и высота строки в ячейке дня расходились,
// и уже на 5-6 строке вниз подпись слева уезжала от своего числа в ячейке дня — реальный
// баг, найден по скриншоту пользователя). "—" всегда рендерится текстом, ни одна строка
// (в т.ч. с "—") не пропускается — иначе то же расхождение высот вернётся.
// Открывает/закрывает <div class="mgroup mgroup-{gk}"> при смене группы — общая для
// staticLabelBlockHTML/compactDayValuesHTML логика, чтобы фон группы (см. .mgroup-* CSS)
// был идентичным блоком и в s2, и в ячейке дня (та же причина, что у .mline высоты —
// расхождение между двумя местами уже один раз давало реальный баг).
let _mgPrevGk=null;
function _mgOpen(gk){
  let out='';
  if(_mgPrevGk!==null)out+='</div>';
  out+=`<div class="mgroup mgroup-${gk}">`;
  _mgPrevGk=gk;
  return out;
}
// План/отклонение для ОДНОЙ метрики в ОДНОЙ ячейке (день / неделя-итого /
// общий итог) — контекстное: cellDays = сколько дней "стоит" эта ячейка
// (1 — колонка одного дня, N — колонка "Итого нед." той недели, lastDataDay —
// накопительно по всем дням периода с фактом). 24.09.2026: раньше был
// отдельный блок "План (в день)" с ОДНИМ и тем же дневным числом во всех
// колонках без разбора — по просьбе пользователя убран, вместо него у самих
// строк Заказы/Выкуп%/Продажи (и остальных с planKey) план теперь считается
// под конкретную колонку: день → план на 1 день, неделя → план на дни этой
// недели, общий итог → накопительно по факту (совпадает с тем, что уже было
// в s2 раньше). planIsRatio (см. METRIC_ROWS — buyoutPct) — план НЕ
// масштабируется по дням, это готовый % target, не сумма.
function _planDevForMetric(m,v,planAgg,cellDays,daysInMonth){
  if(!(planAgg&&m.planKey&&daysInMonth>0))return{planStr:'—',devStr:'—',devCls:''};
  const planTotal=m.planKey(planAgg);
  if(planTotal===null||planTotal===undefined||planTotal===0)return{planStr:'—',devStr:'—',devCls:''};
  const planForPeriod=m.planIsRatio?planTotal:planTotal*(cellDays||0)/daysInMonth;
  const dev=(v||0)-planForPeriod;
  return{
    planStr:fmtMetric(planForPeriod,m.fmt),
    devStr:(dev>=0?'+':'')+fmtMetric(dev,m.fmt),
    devCls:dev>=0?'pv':'nv',
  };
}
// dayArr/cumO — факт (см. выше), planAgg — buildPlanAgg() по тем же артикулам,
// lastDataDay/daysInMonth — для прорейтинга "план по последнюю дату факта"
// (не весь месяц, а план × lastDataDay/daysInMonth — 24.09.2026, по просьбе
// пользователя не сравнивать факт-за-часть-месяца с планом-на-весь-месяц).
function staticLabelBlockHTML(dayArr,cumO,planAgg,lastDataDay,daysInMonth){
  let out='<div class="mline-wrap">';
  _mgPrevGk=null;
  METRIC_ROWS.forEach(m=>{
    const v=metricCumValue(dayArr,cumO,m);
    const pct=metricPct(cumO,m.key,m);
    const cls=(m.key==='np'||m.key==='ret')&&v!==null&&v<0?'nv':'';
    if(m.gk!==_mgPrevGk)out+=_mgOpen(m.gk);
    out+=m.grp?`<div class="msep">${m.grp}</div>`:'';
    // План/отклонение — САМОСТОЯТЕЛЬНЫЕ grid-колонки (см. .mline CSS),
    // выводятся ВСЕГДА, даже "—", у метрик без плана — иначе колонки
    // съезжают между строками.
    const {planStr,devStr,devCls}=_planDevForMetric(m,v,planAgg,lastDataDay,daysInMonth);
    const planPart=`<span class="mline-plan" title="План накопительно, ${lastDataDay||0} дн. из ${daysInMonth}">${planStr}</span>`+
                    `<span class="mline-dev ${devCls}" title="Отклонение от плана">${devStr}</span>`;
    out+=`<div class="mline has-lbl"><span class="mline-lbl">${m.label}</span><span class="mline-fact ${cls}">${fmtMetric(v,m.fmt)}</span>${pctBadgeHTML(pct,v,m)}${planPart}</div>`;
  });
  out+='</div></div>';
  return out;
}
// Компактный ориентир НАД Заказы — ТОЛЬКО для ячейки одного дня (isSingleDay),
// не для "Итого нед." (там уже полная факт/план/откл. разбивка — см. ниже).
// 25.09.2026: полная разбивка по ВСЕМ метрикам в узкой ячейке одного дня —
// избыточно ("полная сводка не нужна"), но и одно голое число с текстом
// "план" внутри строки — тоже неверно ("не пиши план", у нас уже была
// нормальная визуализация). Возвращено: 3 строки (Заказы/Выкуп%/Продажи,
// равномерный дневной темп), БЕЗ подписи "план" в каждой строке — понятно
// по одному лишь синему фону блока (.mgroup-plan), тот же приём, что уже
// на строке категории/артикула не текстом, а цветом отличает группы.
function _dayPlanRefHTML(planAgg,daysInMonth){
  if(!planAgg||!(planAgg.ord>0||planAgg.buy>0)||!(daysInMonth>0))return'';
  const planOrdDay=planAgg.ord/daysInMonth;
  const planSlsDay=planAgg.buy/daysInMonth;
  const planBuyoutPct=planAgg.ord>0?planAgg.buy/planAgg.ord*100:null;
  let out=_mgOpen('plan');
  out+=`<div class="mline f2"><span class="mline-fact">${fmtMetric(planOrdDay,'int')}</span><span class="mline-badge"></span></div>`;
  out+=`<div class="mline f2"><span class="mline-fact">${planBuyoutPct!==null?fmtMetric(planBuyoutPct,'pct'):'—'}</span><span class="mline-badge"></span></div>`;
  out+=`<div class="mline f2"><span class="mline-fact">${fmtMetric(planSlsDay,'int')}</span><span class="mline-badge"></span></div>`;
  return out;
}
// Компактный набор чисел для ОДНОЙ ячейки. Два режима:
//  - isSingleDay=true (ячейка ОДНОГО дня) — только факт+бейдж (2 колонки,
//    .mline.f2), без план/откл. по каждой метрике (см. _dayPlanRefHTML выше
//    вместо этого — один компактный ориентир сверху, по просьбе пользователя).
//  - isSingleDay=false ("Итого нед.") — полный факт/бейдж/план/откл. (4
//    колонки), та же логика, что в staticLabelBlockHTML, без подписи слева
//    (она уже статично в s2, эта ячейка визуально дополняет её).
// cellDays — сколько дней "стоит" эта ячейка (1 или дни недели) — см. _planDevForMetric.
// o может быть null (артикул без единой проводки в этот рабочий день) — раньше тут
// стоял ранний return'' (буквально пустая ячейка, без тире, выглядело как сбой
// загрузки). metricVal(null,key)/metricPct(null,...) уже сами возвращают null,
// а fmtMetric(null,...) уже возвращает '—' — просто не бейлимся раньше времени.
function compactDayValuesHTML(o,planAgg,cellDays,daysInMonth,isSingleDay){
  let out='<div class="mline-wrap">';
  _mgPrevGk=null;
  if(isSingleDay)out+=_dayPlanRefHTML(planAgg,daysInMonth);
  METRIC_ROWS.forEach(m=>{
    const v=metricVal(o,m.key);
    const pct=metricPct(o,m.key,m);
    const cls=(m.key==='np'||m.key==='ret')&&v!==null&&v<0?'nv':'';
    if(m.gk!==_mgPrevGk)out+=_mgOpen(m.gk);
    out+=m.grp?'<div class="msep">&nbsp;</div>':'';
    if(isSingleDay){
      out+=`<div class="mline f2"><span class="mline-fact ${cls}">${fmtMetric(v,m.fmt)}</span>${pctBadgeHTML(pct,v,m)}</div>`;
    }else{
      const {planStr,devStr,devCls}=_planDevForMetric(m,v,planAgg,cellDays,daysInMonth);
      const planPart=`<span class="mline-plan">${planStr}</span><span class="mline-dev ${devCls}">${devStr}</span>`;
      out+=`<div class="mline"><span class="mline-fact ${cls}">${fmtMetric(v,m.fmt)}</span>${pctBadgeHTML(pct,v,m)}${planPart}</div>`;
    }
  });
  out+='</div></div>';
  return out;
}

// ─── Тренд: модалка с графиком по артикулу/категории ──────────
let TREND=null; // {mp, sellerArticle, category, isCategory, dateFrom, dateTo, period, granularity, metric, rawRows, buckets}

const TREND_METRICS=[
  {key:'revenue', label:'Выручка',  pct:false, get:b=>b.rev,
    tip:b=>[['Продажи',b.sls],['Заказы',b.ord],['Ср. чек',b.sls>0?Nf(b.rev/b.sls)+'₽':'—'],['Выкупаемость',b.ord>0?(b.sls/b.ord*100).toFixed(1)+'%':'—']]},
  {key:'orders',  label:'Заказы',   pct:false, get:b=>b.ord,
    tip:b=>[['Продажи',b.sls],['Выкупаемость',b.ord>0?(b.sls/b.ord*100).toFixed(1)+'%':'—'],['Показы',Fk(b.shows)],['Клики',Fk(b.clicks)]]},
  {key:'sales',   label:'Продажи',  pct:false, get:b=>b.sls,
    tip:b=>[['Заказы',b.ord],['Выручка',Nf(b.rev)+'₽'],['Ср. чек',b.sls>0?Nf(b.rev/b.sls)+'₽':'—']]},
  {key:'avgcheck',label:'Ср. чек',  pct:false, get:b=>b.sls>0?b.rev/b.sls:0,
    tip:b=>[['Продажи',b.sls],['Выручка',Nf(b.rev)+'₽']]},
  {key:'profit',  label:'ЧП %',     pct:true,  get:b=>{const c=trendCogs(b);return (b.rev>0&&c>0)?(b.rev-c-b.spend-b.comm-b.logi-b.acq)/b.rev*100:null;},
    tip:b=>{const c=trendCogs(b);const np=(b.rev>0&&c>0)?b.rev-c-b.spend-b.comm-b.logi-b.acq:null;
      return[['ЧП, ₽',np!==null?Nf(np)+'₽':'—'],['Выручка',Nf(b.rev)+'₽'],['Себестоимость',c>0?Nf(c)+'₽':'—'],['Комиссия+Лог.+Экв.',Nf(b.comm+b.logi+b.acq)+'₽'],['ДРР',Nf(b.spend)+'₽']];}},
  {key:'drr',     label:'ДРР %',    pct:true,  get:b=>b.rev>0?b.spend/b.rev*100:0,
    tip:b=>[['Расход',Nf(b.spend)+'₽'],['Выручка',Nf(b.rev)+'₽'],['Показы',Fk(b.shows)],['Клики',Fk(b.clicks)],['CTR',b.shows>0?(b.clicks/b.shows*100).toFixed(2)+'%':'—']]},
  {key:'comm',    label:'Комиссия', pct:false, get:b=>b.comm,
    tip:b=>[['% от выручки',b.ftrev>0?(b.comm/b.ftrev*100).toFixed(1)+'%':'—'],['Наша выручка (МП)',Nf(b.ftrev)+'₽']]},
  {key:'acq',     label:'Эквайринг',pct:false, get:b=>b.acq,
    tip:b=>[['% от выручки',b.ftrev>0?(b.acq/b.ftrev*100).toFixed(1)+'%':'—'],['Наша выручка (МП)',Nf(b.ftrev)+'₽']]},
  {key:'logi',    label:'Логистика',pct:false, get:b=>b.logi,
    tip:b=>[['% от выручки',b.ftrev>0?(b.logi/b.ftrev*100).toFixed(1)+'%':'—'],['Наша выручка (МП)',Nf(b.ftrev)+'₽']]},
];
function trendCogs(b){return b.cogsSum||0;}
function trendFmt(v,pct){if(v===null||v===undefined)return'—';return pct?v.toFixed(1)+'%':(Number.isInteger(v)?Nf(v):Nf(Math.round(v)))+(pct?'':'');}

async function openTrend(mp,sellerArticle,category,isCategory){
  const to=new Date();
  const from=new Date();from.setDate(from.getDate()-29);
  TREND={
    mp, sellerArticle, category, isCategory,
    dateFrom:from.toISOString().slice(0,10), dateTo:to.toISOString().slice(0,10),
    period:30, granularity:'day', metric:'revenue', rawRows:[], buckets:[],
  };
  document.getElementById('trend-title').textContent=isCategory?`📁 ${category}`:sellerArticle;
  document.getElementById('trend-modal').style.display='block';
  renderTrendControls();
  await loadTrendData();
  renderTrendChart();
}
function closeTrend(){
  document.getElementById('trend-modal').style.display='none';
  document.getElementById('trend-tooltip').style.display='none';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&TREND)closeTrend();});

function renderTrendControls(){
  const periods=[[7,'7д'],[30,'30д'],[90,'90д'],['custom','Свой период']];
  document.getElementById('trend-period-group').innerHTML='<span class="glbl">Период:</span>'+periods.map(([v,l])=>
    `<button class="trend-btn${TREND.period===v?' on':''}" onclick="setTrendPeriod('${v}')">${l}</button>`).join('');
  document.getElementById('trend-custom-group').style.display=TREND.period==='custom'?'flex':'none';
  document.getElementById('trend-date-from').value=TREND.dateFrom;
  document.getElementById('trend-date-to').value=TREND.dateTo;
  const grans=[['day','По дням'],['week','По неделям'],['month','По месяцам']];
  document.getElementById('trend-gran-group').innerHTML='<span class="glbl">Разбивка:</span>'+grans.map(([v,l])=>
    `<button class="trend-btn${TREND.granularity===v?' on':''}" onclick="setTrendGranularity('${v}')">${l}</button>`).join('');
  document.getElementById('trend-metric-group').innerHTML=TREND_METRICS.map(m=>
    `<button class="trend-btn${TREND.metric===m.key?' on':''}" onclick="setTrendMetric('${m.key}')">${m.label}</button>`).join('');
}
async function setTrendPeriod(v){
  if(v==='custom'){TREND.period='custom';renderTrendControls();return;}
  const days=parseInt(v);
  const to=new Date();const from=new Date();from.setDate(from.getDate()-(days-1));
  TREND.period=days;TREND.dateFrom=from.toISOString().slice(0,10);TREND.dateTo=to.toISOString().slice(0,10);
  renderTrendControls();
  await loadTrendData();renderTrendChart();
}
async function onTrendCustomDate(){
  const f=document.getElementById('trend-date-from').value;
  const t=document.getElementById('trend-date-to').value;
  if(!f||!t||f>t)return;
  TREND.dateFrom=f;TREND.dateTo=t;TREND.period='custom';
  await loadTrendData();renderTrendChart();
}
function setTrendGranularity(g){TREND.granularity=g;renderTrendControls();buildTrendBuckets();renderTrendChart();}
function setTrendMetric(m){TREND.metric=m;renderTrendControls();renderTrendChart();}

async function loadTrendData(){
  const mp_db=MP_DB[TREND.mp]||TREND.mp;
  const filter=TREND.isCategory
    ?`category=eq.${encodeURIComponent(TREND.category)}`
    :`seller_article=eq.${encodeURIComponent(TREND.sellerArticle)}`;
  const cols='date,orders_qty,confirmed_qty,confirmed_sum,spend,ad_shows,clicks,commission_day,logistics_day,acquiring_day,ft_rev_day,cogs';
  const baseUrl=`${SB_URL}/rest/v1/v_daily_dashboard?marketplace=eq.${mp_db}&${filter}&date=gte.${TREND.dateFrom}&date=lte.${TREND.dateTo}&select=${cols}&order=date`;
  const pageSize=1000;let all=[];let offset=0;
  while(true){
    const r=await fetch(`${baseUrl}&limit=${pageSize}&offset=${offset}`,{headers:{apikey:SB_ANON,Authorization:`Bearer ${SB_ANON}`}});
    if(!r.ok)break;
    const batch=await r.json();
    all=all.concat(batch);
    if(batch.length<pageSize)break;
    offset+=pageSize;
  }
  TREND.rawRows=all;
  buildTrendBuckets();
}

function buildTrendBuckets(){
  const byDate={};
  for(const r of TREND.rawRows){
    const d=r.date;
    if(!byDate[d])byDate[d]={date:d,ord:0,sls:0,rev:0,spend:0,shows:0,clicks:0,comm:0,logi:0,acq:0,ftrev:0,cogsSum:0};
    const o=byDate[d];
    o.ord+=r.orders_qty||0;
    // sls/rev — подтверждённые продажи (financial_transactions), не dm.buyouts_qty/sum —
    // тот же принцип, что в основной таблице (см. коммент у map[k].days[dd]).
    o.sls+=r.confirmed_qty||0;
    o.rev+=parseFloat(r.confirmed_sum)||0;
    o.spend+=parseFloat(r.spend)||0;
    o.shows+=r.ad_shows||0; // показы от рекламы (ad_stats), не органическая воронка — см. коммент выше в map[k].days
    o.clicks+=r.clicks||0;
    // Комиссия/логистика/эквайринг привязаны к продаже — тот же принцип, что в основной таблице
    if((r.confirmed_qty||0)>0){
      o.comm+=parseFloat(r.commission_day)||0;
      o.logi+=parseFloat(r.logistics_day)||0;
      o.acq+=parseFloat(r.acquiring_day)||0;
    }
    o.ftrev+=parseFloat(r.ft_rev_day)||0;
    o.cogsSum+=(parseFloat(r.cogs)||0)*(r.confirmed_qty||0);
  }
  // Заполняем ВСЕ даты диапазона нулями — v_daily_dashboard строится через JOIN из
  // daily_metrics, и день без единой строки (не 0, а прямо отсутствие записи) просто
  // выпадает из выборки, из-за чего график молча "перепрыгивал" через пустые дни
  // вместо честного нуля.
  // toISOString() тут нельзя — она конвертирует в UTC и на сдвиг локального часового
  // пояса сдвигает дату на день назад/вперёд (нашли на реальном кейсе: график молча
  // пропускал день). Форматируем вручную из локальных getFullYear/Month/Date.
  const fmtLocal=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let cur=new Date(TREND.dateFrom+'T00:00:00');
  const endD=new Date(TREND.dateTo+'T00:00:00');
  while(cur<=endD){
    const key=fmtLocal(cur);
    if(!byDate[key])byDate[key]={date:key,ord:0,sls:0,rev:0,spend:0,shows:0,clicks:0,comm:0,logi:0,acq:0,ftrev:0,cogsSum:0};
    cur.setDate(cur.getDate()+1);
  }
  const dates=Object.keys(byDate).sort();
  const g=TREND.granularity;
  if(g==='day'){
    TREND.buckets=dates.map(d=>({key:d,label:d.slice(5).replace('-','.'),...byDate[d]}));
    return;
  }
  const groups={};
  for(const d of dates){
    const dt=new Date(d+'T00:00:00');
    let key,label;
    if(g==='week'){
      const monday=new Date(dt);monday.setDate(dt.getDate()-((dt.getDay()+6)%7));
      key=fmtLocal(monday);
      label='нед '+key.slice(5).replace('-','.');
    }else{
      key=d.slice(0,7);
      label=MONTHS_RU[dt.getMonth()+1].slice(0,3)+' '+key.slice(0,4).slice(2);
    }
    if(!groups[key])groups[key]={key,label,ord:0,sls:0,rev:0,spend:0,shows:0,clicks:0,comm:0,logi:0,acq:0,ftrev:0,cogsSum:0};
    const src=byDate[d],dst=groups[key];
    for(const f of['ord','sls','rev','spend','shows','clicks','comm','logi','acq','ftrev','cogsSum'])dst[f]+=src[f];
  }
  TREND.buckets=Object.keys(groups).sort().map(k=>groups[k]);
}

function renderTrendChart(){
  const svg=document.getElementById('trend-svg');
  const metric=TREND_METRICS.find(m=>m.key===TREND.metric);
  const buckets=TREND.buckets;
  if(!buckets.length){
    svg.innerHTML='';
    document.getElementById('trend-summary').innerHTML='<div class="trend-empty">Нет данных за выбранный период</div>';
    return;
  }
  const W=900,H=280,padL=44,padR=12,padT=14,padB=28;
  const vals=buckets.map(b=>metric.get(b)).map(v=>v===null?0:v);
  const nz=vals.filter((v,i)=>metric.get(buckets[i])!==null);
  const mn=Math.min(0,...nz),mx=Math.max(1,...nz);
  const rng=(mx-mn)||1;
  const x=i=>padL+(buckets.length>1?i/(buckets.length-1)*(W-padL-padR):(W-padL-padR)/2);
  const y=v=>H-padB-((v-mn)/rng)*(H-padT-padB);
  const pts=buckets.map((b,i)=>({x:x(i),y:y(metric.get(b)===null?mn:metric.get(b)),b,i,has:metric.get(b)!==null}));
  let path='';
  pts.forEach((p,i)=>{if(!p.has)return;path+=(path?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1);});
  // Сетка + подписи оси Y (3 линии)
  let grid='';
  for(let k=0;k<=2;k++){
    const v=mn+rng*k/2;
    const gy=y(v);
    grid+=`<line x1="${padL}" y1="${gy}" x2="${W-padR}" y2="${gy}" stroke="var(--color-border-tertiary)" stroke-width="1"/>`;
    grid+=`<text x="${padL-6}" y="${gy+3}" font-size="9" text-anchor="end" fill="var(--color-text-tertiary)">${metric.pct?v.toFixed(0)+'%':Fk(v)}</text>`;
  }
  // Подписи оси X — не все, чтобы не налезали
  const step=Math.ceil(buckets.length/10)||1;
  let xlabels='';
  buckets.forEach((b,i)=>{
    if(i%step!==0&&i!==buckets.length-1)return;
    xlabels+=`<text x="${x(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--color-text-tertiary)">${b.label}</text>`;
  });
  const color='var(--color-text-primary)';
  const circles=pts.filter(p=>p.has).map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
  svg.innerHTML=`${grid}${xlabels}<path d="${path}" fill="none" stroke="${color}" stroke-width="2"/>${circles}
    <rect id="trend-hitzone" x="${padL}" y="0" width="${W-padL-padR}" height="${H}" fill="transparent"/>`;

  const hit=document.getElementById('trend-hitzone');
  const wrap=svg.parentElement;
  const tooltip=document.getElementById('trend-tooltip');
  function showTip(evt){
    const rect=svg.getBoundingClientRect();
    const svgX=(evt.clientX-rect.left)/rect.width*W;
    let nearest=0,best=Infinity;
    pts.forEach((p,i)=>{const d=Math.abs(p.x-svgX);if(d<best){best=d;nearest=i;}});
    const b=buckets[nearest];
    const rows=metric.tip(b).map(([l,v])=>`<div class="tt-row"><span>${l}</span><b>${v}</b></div>`).join('');
    const val=metric.get(b);
    const unit=metric.pct?'':(metric.key==='orders'||metric.key==='sales'?'':'₽');
    tooltip.innerHTML=`<div class="tt-date">${b.label} — ${metric.label}: <b>${trendFmt(val,metric.pct)}${unit}</b></div>${rows}`;
    tooltip.style.display='block';
    const wrapRect=wrap.getBoundingClientRect();
    let left=evt.clientX-wrapRect.left+12;
    if(left+220>wrapRect.width)left=evt.clientX-wrapRect.left-232;
    tooltip.style.left=Math.max(0,left)+'px';
    tooltip.style.top=(evt.clientY-wrapRect.top-40)+'px';
  }
  hit.addEventListener('mousemove',showTip);
  hit.addEventListener('mouseleave',()=>{tooltip.style.display='none';});

  // Summary
  const sumVal=buckets.reduce((s,b)=>{const v=metric.get(b);return s+(v===null?0:v);},0);
  const avgVal=sumVal/buckets.length;
  let bestB=buckets[0],bestV=-Infinity;
  buckets.forEach(b=>{const v=metric.get(b);if(v!==null&&v>bestV){bestV=v;bestB=b;}});
  const isSummable=!metric.pct;
  document.getElementById('trend-summary').innerHTML=`
    ${isSummable?`<div class="trend-sum-item">Итого за период<b>${trendFmt(sumVal,false)}${metric.pct?'':(metric.key==='orders'||metric.key==='sales'?'':'₽')}</b></div>`:''}
    <div class="trend-sum-item">Среднее за ${TREND.granularity==='day'?'день':TREND.granularity==='week'?'неделю':'месяц'}<b>${trendFmt(avgVal,metric.pct)}${metric.pct?'':(metric.key==='orders'||metric.key==='sales'?'':'₽')}</b></div>
    <div class="trend-sum-item">Лучший период<b>${bestB.label}: ${trendFmt(bestV,metric.pct)}${metric.pct?'':(metric.key==='orders'||metric.key==='sales'?'':'₽')}</b></div>`;
}

function renderKPI(){
  const d=DATA[CMP];if(!d)return;
  document.getElementById('kstrip').innerHTML=d.kpi.map(k=>{
    const hasPlan = k.plan!==null && k.pct!==null;
    // Для ДРР: меньше — лучше, поэтому цвета инвертированы
    const good = k.inv ? k.pct<=100 : k.pct>=100;
    const warn = k.inv ? k.pct<=115 : k.pct>=70;
    const pctCls  = !hasPlan?'': good?'ok': warn?'warn':'err';
    const barPct  = k.inv ? Math.min(Math.round(k.pct/2), 100) : Math.min(k.pct, 100);
    const barColor= good?'var(--color-text-success)': warn?'#d97706':'var(--color-text-danger)';
    // Отклонение: для ДРР "+" — плохо, для остальных "+" — хорошо
    const devVal = k.dev;
    const devPositive = devVal && devVal.startsWith('+');
    const devGood = devVal ? (k.inv ? !devPositive : devPositive) : null;
    const devCls = devVal ? (devGood ? 'color:var(--color-text-success)' : 'color:var(--color-text-danger)') : '';
    const clickable = !!k.expand;

    return `<div class="kc"${clickable?` style="cursor:pointer" onclick="toggleKpiBreakdown()" title="Показать/скрыть по категориям и цветомоделям"`:''}>
      <div class="kl">${k.l}${clickable?' <span style="font-size:9px;color:var(--color-text-tertiary)">▾</span>':''}</div>
      <div class="kv">${k.v}</div>
      ${hasPlan?`
      <div class="krow" style="margin-top:3px">
        <span class="kp">план&nbsp;${k.plan}</span>
        <span class="bd ${pctCls}">${k.pct}%</span>
      </div>
      ${devVal?`<div style="font-size:10px;margin-top:2px;${devCls}">откл.&nbsp;${devVal}</div>`:''}
      <div class="kpbar" style="margin-top:4px"><div class="kpfill"
        style="width:${barPct}%;background:${barColor}"></div></div>`
      :`<div style="font-size:10px;color:var(--color-text-tertiary);margin-top:4px">нет плана</div>`}
    </div>`;
  }).join('');
  renderKpiBreakdown();
}

// Точные суммы (не %) по списку артикулов за произвольный список дней (день/неделя/
// период — тот же принцип, что artPre/catFactXXX выше, только обобщённо на любой
// список дней, не только "весь видимый период"). Нужно для столбца "Итого нед.".
function calcStats(arts,dayList){
  let ord=0,sls=0,rev=0,spend=0,comm=0,acq=0,logi=0,gross=0,cogsTotal=0,shows=0,clicks=0,cart=0,adOrders=0;
  for(const art of arts){
    let artSls=0;
    for(const day of dayList){
      if(day.off)continue;
      ord+=getV(art,day,'orders');
      const s=getV(art,day,'sales'); sls+=s; artSls+=s;
      rev+=getV(art,day,'revenue');
      spend+=getV(art,day,'spend');
      comm+=getV(art,day,'comm');
      acq+=getV(art,day,'acq');
      logi+=getV(art,day,'logi');
      shows+=getV(art,day,'shows');
      clicks+=getV(art,day,'clicks');
      cart+=getV(art,day,'cart');
      adOrders+=getV(art,day,'adOrders');
      const dd=art.days[day.d];
      gross+=(dd?(dd.ftrev||0):0);
    }
    cogsTotal+=art.cogs*artSls;
  }
  const drr=rev>0?parseFloat((spend/rev*100).toFixed(1)):0;
  const commPct=gross>0?parseFloat((comm/gross*100).toFixed(1)):0;
  const logiPct=gross>0?parseFloat((logi/gross*100).toFixed(1)):0;
  const ctr=shows>0?parseFloat((clicks/shows*100).toFixed(2)):0;
  let profit=0;
  if(rev>0&&cogsTotal>0)profit=parseFloat(((rev-cogsTotal-spend-comm-acq-logi)/rev*100).toFixed(1));
  return{ord,sls,rev,spend,comm,acq,logi,shows,clicks,cart,adOrders,drr,commPct,logiPct,ctr,profit};
}
function statValueForMetric(s,metric){

  if(metric==='clicks')return s.clicks;

}
// То же самое, но для режима "Все" — возвращает gateDay-образный объект (для
// compactDayValuesHTML), суммированный по артикулам и дням недели. Остаток (stockQty) —
// НЕ сумма (см. cumMode:'last' у METRIC_ROWS) — последнее известное значение за
// неделю, просуммированное по артикулам на ТУ дату.
function calcGatedWeekCum(arts,weekDays){
  const o={ord:0,sls:0,rev:0,ret:0,spend:0,comm:0,logi:0,acq:0,cogs:0,ftrev:0,mrev:0,
    adShows:0,adClicks:0,adCart:0,adOrders:0,totalShows:0,totalCart:0,totalOrders:0,cancelled:0,stockQty:0};
  for(const art of arts){
    for(const day of weekDays){
      if(day.off)continue;
      const d=gateDay(art.days[day.d],art.cogs,art.ft_gross_rev);
      if(!d)continue;
      o.ord+=d.ord;o.sls+=d.sls;o.rev+=d.rev;o.ret+=d.ret;o.spend+=d.spend;
      o.comm+=d.comm;o.logi+=d.logi;o.acq+=d.acq;o.cogs+=d.cogs;o.ftrev+=d.ftrev;o.mrev+=d.mrev;
      o.adShows+=d.adShows;o.adClicks+=d.adClicks;o.adCart+=d.adCart;o.adOrders+=d.adOrders;
      o.totalShows+=d.totalShows;o.totalCart+=d.totalCart;o.totalOrders+=d.totalOrders;o.cancelled+=d.cancelled;
    }
  }
  for(let i=weekDays.length-1;i>=0;i--){
    const day=weekDays[i];
    if(day.off)continue;
    let sum=0,found=false;
    for(const art of arts){
      const d=gateDay(art.days[day.d],art.cogs,art.ft_gross_rev);
      if(d){found=true;sum+=d.stockQty||0;}
    }
    if(found){o.stockQty=sum;break;}
  }
  return o;
}

    const cc=CAT_COLORS[cat]||'#eee';
    const catId='cat_'+catIdx;

    // Предвычисление метрик по каждому артикулу (нужно для ЧП категории до рендера строки).
    // factComm/factAcq/factLogi — ТОЧНЫЕ суммы по видимым дням (wdo, уважает выбор недели),
    // а не art.commission_sum/acquiring_sum/logistics_sum (те всегда за ВЕСЬ месяц) —
    // раньше при выборе недели это давало рассинхрон масштабов и завышало ЧП.
    const wdo=days.filter(dv=>!dv.off);
    const artPre=arts.map(art=>({
      art,
      factSls:  wdo.reduce((a,d)=>a+getV(art,d,'sales'),0),
      factRev:  wdo.reduce((a,d)=>a+getV(art,d,'revenue'),0),
      factSpend:wdo.reduce((a,d)=>a+getV(art,d,'spend'),0),
      factComm: wdo.reduce((a,d)=>a+getV(art,d,'comm'),0),
      factAcq:  wdo.reduce((a,d)=>a+getV(art,d,'acq'),0),
      factLogi: wdo.reduce((a,d)=>a+getV(art,d,'logi'),0),
      factGross:wdo.reduce((a,d)=>{const dd=art.days[d.d];return a+(dd&&!d.off?(dd.ftrev||0):0);},0),
    }));

    // Подитоги по категории за каждый день
    // Для %-метрик суммировать нельзя — считаем из сумм ₽
    const catDayTotals=CM==='all'?null:days.map(day=>{
      if(CM==='commPct'||CM==='logiPct'){
        const num=arts.reduce((s,art)=>s+getV(art,day,CM==='commPct'?'comm':'logi'),0);
        const den=arts.reduce((s,art)=>{const d=art.days[day.d];return s+(d&&!day.off?d.ftrev:0);},0);
        return den>0?parseFloat((num/den*100).toFixed(1)):0;
      }
      return arts.reduce((s,art)=>s+getV(art,day,CM),0);
    });
    // В режиме "Все" — подитог по категории за день это сумма ₽-полей всех артикулов
    const catDayAll=CM!=='all'?null:days.map(day=>{
      if(day.off)return null;
      const o={ord:0,sls:0,rev:0,ret:0,spend:0,comm:0,logi:0,acq:0,cogs:0,ftrev:0,mrev:0,
        adShows:0,adClicks:0,adCart:0,adOrders:0,totalShows:0,totalCart:0,totalOrders:0,cancelled:0,stockQty:0};
      for(const art of arts){
        const d=gateDay(art.days[day.d],art.cogs,art.ft_gross_rev);if(!d)continue;
        o.ord+=d.ord;o.sls+=d.sls;o.rev+=d.rev;o.ret+=d.ret;o.spend+=d.spend;
        o.comm+=d.comm;o.logi+=d.logi;o.acq+=d.acq;o.cogs+=d.cogs;o.ftrev+=d.ftrev;o.mrev+=d.mrev;
        o.adShows+=d.adShows;o.adClicks+=d.adClicks;o.adCart+=d.adCart;o.adOrders+=d.adOrders;
        o.totalShows+=d.totalShows;o.totalCart+=d.totalCart;o.totalOrders+=d.totalOrders;o.cancelled+=d.cancelled;
        // Остаток за день СУММИРУЕМ ПО АРТИКУЛАМ (сколько всего на складе у категории
        // в этот день) — осмысленно. А вот cumCatStock ниже (по дням периода) — нет, см. cumMode:'last'.
        o.stockQty+=d.stockQty;
      }
      return o;
    });
    const catFactOrd=days.filter(dv=>!dv.off).reduce((s,day)=>s+arts.reduce((a,art)=>a+getV(art,day,'orders'),0),0);
    const catFactSls=artPre.reduce((s,p)=>s+p.factSls,0);
    const catFactRev=artPre.reduce((s,p)=>s+p.factRev,0);
    const catFactSpend=artPre.reduce((s,p)=>s+p.factSpend,0);
    const catFactDrr=catFactRev>0?parseFloat((catFactSpend/catFactRev*100).toFixed(1)):0;
    const catFact=CM==='drr'?catFactDrr:CM==='revenue'?catFactRev:CM==='spend'?catFactSpend:CM==='sales'?catFactSls:catFactOrd;
    // Точные суммы за ВИДИМЫЙ период (wdo) — не art.commission_sum/acquiring_sum/logistics_sum/
    // ft_gross_rev (те всегда за весь месяц), иначе при выборе недели считаем на рассинхроне
    // масштабов (неделя vs месяц) — раньше это давало завышенный ЧП вплоть до фейковых 100%.
    const catComm=artPre.reduce((s,p)=>s+p.factComm,0);
    const catAcq =artPre.reduce((s,p)=>s+p.factAcq,0);
    const catLogi=artPre.reduce((s,p)=>s+p.factLogi,0);
    const catGross=artPre.reduce((s,p)=>s+p.factGross,0);
    // ЧП по категории — без прорейтинга, всё точное за один и тот же период
    const catCogsTotal=artPre.reduce((s,{art,factSls})=>s+art.cogs*factSls,0);
    let catNp=null;
    if(catFactRev>0&&catCogsTotal>0){
      catNp=catFactRev-catCogsTotal-catFactSpend-catComm-catAcq-catLogi;
    }
    const catNpPct=catNp!==null&&catFactRev>0?(catNp/catFactRev*100).toFixed(1):null;

    // Взвешенное среднее commission_pct по сумме комиссии
    const _cpArts=arts.filter(a=>a.commission_pct>0&&a.commission_sum>0);
    const catCommPct=_cpArts.length>0
      ? (_cpArts.reduce((s,a)=>s+a.commission_pct*a.commission_sum,0)/_cpArts.reduce((s,a)=>s+a.commission_sum,0)).toFixed(1)
      : (catGross>0?(catComm/catGross*100).toFixed(1):null);

    // ── План по категории (24.09.2026: раньше на групповых строках плана не
    // было вообще, только факт — план показывался только на строке отдельного
    // артикула). Простая сумма art.plan_* по всем артикулам категории — те же
    // поля, что уже читает buildArticles()/mkPR() на строке артикула, здесь
    // просто складываем по группе, ничего заново не запрашиваем. ДРР —
    // невзвешенное среднее % по артикулам, у которых план ДРР задан (та же
    // логика, что avgPlanDrr в buildKPI() для карточки в kstrip).
    // Общий агрегат плана категории — для METRIC_ROWS-блока (режим "Все",
    // staticLabelBlockHTML/compactDayValuesHTML) и для блока "План (в день)"
    // над Заказы. catPlanOrd/catPlanBuy/... ниже — те же числа, для
    // не-"Все"-режима (mkPR-строки), посчитаны отдельно, т.к. были раньше.
    const catPlanAgg=buildPlanAgg(arts);
    const catPlanOrd=arts.reduce((s,a)=>s+(a.plan_ord||0),0);
    const catPlanBuy=arts.reduce((s,a)=>s+(a.plan_buy||0),0);
    const catPlanRev=arts.reduce((s,a)=>s+(a.plan_rev||0),0);
    const _drrArts=arts.filter(a=>a.plan_drr>0);
    const catPlanDrr=_drrArts.length>0?_drrArts.reduce((s,a)=>s+a.plan_drr,0)/_drrArts.length:0;
    // Комиссия/логистика плана — сумма ₽-сумм по артикулам (не среднее % —
    // база выручки разная у каждого), та же формула, что у отдельного
    // артикула (art.plan_rev×art.plan_comm_pct/100), только сложенная по группе.
    const catPlanComm=arts.reduce((s,a)=>s+(a.plan_rev>0&&a.plan_comm_pct>0?a.plan_rev*a.plan_comm_pct/100:0),0);
    const catPlanLogi=arts.reduce((s,a)=>s+(a.plan_rev>0&&a.plan_logi_pct>0?a.plan_rev*a.plan_logi_pct/100:0),0);
    const catPlanNp=arts.reduce((s,a)=>{
      if(!(a.plan_rev>0))return s;
      const c=a.plan_comm_pct>0?a.plan_rev*a.plan_comm_pct/100:0;
      const l=a.plan_logi_pct>0?a.plan_rev*a.plan_logi_pct/100:0;
      return s+(a.plan_rev-a.plan_vc*a.plan_buy-a.plan_spend-c-l);
    },0);

    // Восстанавливаем состояние свёртки после перерисовки
    const isCollapsed=!!CAT_COLLAPSED[catId];
    const iconChar=isCollapsed?'▶':'▼';

    // Накопительный итог категории за видимый период — нужен для s2 в режиме "Все"
    // (до рендера строки, а не после — иначе не успевает к s2).
    let catCum=null;
    if(CM==='all'){
      catCum={ord:0,sls:0,rev:0,ret:0,spend:0,comm:0,logi:0,acq:0,cogs:0,ftrev:0,
        adShows:0,adClicks:0,adCart:0,adOrders:0,totalShows:0,totalCart:0,totalOrders:0,cancelled:0};
      catDayAll.forEach(o=>{if(!o)return;
        for(const k in catCum)catCum[k]+=o[k]||0;
      });
    }

    html+=`<tr class="cat-row" onclick="toggleCat('${catId}')">
      <td class="s0 cat-toggle"><span id="ci_${catId}">${iconChar}</span></td>
      <td class="s1" style="padding-left:6px">
        <span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${cc};margin-right:6px;vertical-align:middle;border:0.5px solid rgba(0,0,0,0.1)"></span>${cat}
        <span style="font-size:9px;color:var(--color-text-tertiary);margin-left:4px">${arts.length} арт.</span>
      </td>
      <td class="s2 plan-col">${CM==='all'?staticLabelBlockHTML(catDayAll,catCum,catPlanAgg,periodDays,daysInMonth):`
        <div class="pr-wrap" style="gap:2px">
          ${mkPR('Заказы',  catFactOrd, catPlanOrd, v=>v||0)}
          ${mkPR('Продажи', catFactSls, catPlanBuy, v=>v||0)}
          ${mkPR('Выручка', catFactRev, catPlanRev, v=>Nf(v)+'₽')}
          ${catFactSls>0?`<div class="pr-row"><span class="pr-lbl">Ср. чек</span><span class="pr-fact">${Nf(catFactRev/catFactSls)}₽</span></div>`:''}
          ${catNp!==null?`<div class="pr-row"><span class="pr-lbl">ЧП</span><span class="pr-fact ${catNp>=0?'pv':'nv'}">${Nf(catNp)}₽</span>${catNpPct?`<span class="pr-pct" style="background:${catNp>=0?'var(--color-background-success,#e6f4ea)':'var(--color-background-error,#fce8e6)'};color:${catNp>=0?'var(--color-text-success,#137333)':'var(--color-text-error,#c5221f)'}">${catNpPct}%</span>`:''}${catPlanNp!==0?`<span class="pr-sep">/</span><span class="pr-plan">${Nf(catPlanNp)}₽</span>`:''}</div>`:''}
          ${catFactSpend>0?`<div class="pr-row"><span class="pr-lbl">ДРР</span><span class="pr-fact">${Nf(catFactSpend)}₽</span><span class="pr-pct" style="background:var(--color-background-warning);color:var(--color-text-warning)">${catFactDrr}%</span>${catPlanDrr>0?`<span class="pr-sep">/</span><span class="pr-plan">${catPlanDrr.toFixed(1)}%</span>`:''}</div>`:''}
          ${catComm>0?`<div class="pr-row"><span class="pr-lbl">Комиссия</span><span class="pr-fact">${Nf(catComm)}₽</span>${catCommPct?`<span class="pr-pct" style="background:var(--color-background-warning);color:var(--color-text-warning)">${catCommPct}%</span>`:''}${catPlanComm>0?`<span class="pr-sep">/</span><span class="pr-plan">${Nf(catPlanComm)}₽</span>`:''}</div>`:''}
          ${catAcq>0?`<div class="pr-row"><span class="pr-lbl">Эквайринг</span><span class="pr-fact">${Nf(catAcq)}₽</span>${catGross>0?`<span class="pr-pct" style="background:var(--color-background-warning);color:var(--color-text-warning)">${(catAcq/catGross*100).toFixed(1)}%</span>`:''}</div>`:''}
          ${catLogi>0?`<div class="pr-row"><span class="pr-lbl">Логистика</span><span class="pr-fact">${Nf(catLogi)}₽</span>${catGross>0?`<span class="pr-pct" style="background:var(--color-background-warning);color:var(--color-text-warning)">${(catLogi/catGross*100).toFixed(1)}%</span>`:''}${catPlanLogi>0?`<span class="pr-sep">/</span><span class="pr-plan">${Nf(catPlanLogi)}₽</span>`:''}</div>`:''}
        </div>`}
      </td>`;
    weekGroups.forEach((wg,wi)=>{
      const collapsed=!!WEEK_COLLAPSED[wg.wk];
      const wkDayList=wg.days.map(x=>x.day);
      const wkSepCls=wi>0?' wk-sep':'';
      if(CM==='all'){
        html+=`<td class="cat-sub wk-total${wkSepCls}">${compactDayValuesHTML(calcGatedWeekCum(arts,wkDayList),catPlanAgg,wg.days.length,daysInMonth,false)}</td>`;
      }else{
        const wv=statValueForMetric(calcStats(arts,wkDayList),CM);
        html+=`<td class="cat-sub wk-total${wkSepCls}">${fmtV(wv,CM)}</td>`;
      }
      if(!collapsed)wg.days.forEach(({day,di})=>{
        if(CM==='all'){
          html+=`<td class="cat-sub${day.off?' off-day':''}">${day.off?'—':compactDayValuesHTML(catDayAll[di],catPlanAgg,1,daysInMonth,true)}</td>`;
        }else{
          const v=catDayTotals[di];
          html+=`<td class="cat-sub${day.off?' off-day':''}">${day.off?'—':fmtV(v,CM)}</td>`;
        }
      });
    });
    html+=`<td class="trend-cell" title="Открыть график по категории"
      onclick="event.stopPropagation();openTrend('${MP_DB[CMP]||CMP}',null,'${cat.replace(/'/g,"\\'")}',true)">📈</td><td></td></tr>`;

    artPre.forEach(({art,factSls,factRev,factSpend,factComm,factAcq,factLogi,factGross})=>{
      const factOrd=wdo.reduce((a,day)=>a+getV(art,day,'orders'),0);
      const factDrr=factRev>0?parseFloat((factSpend/factRev*100).toFixed(1)):0;
      const factCogs=(art.plan_vc+art.plan_fc)*factSls;
      const pctOrd=art.plan_ord?Math.round(factOrd/art.plan_ord*100):0;
      const pctRev=art.plan_rev?Math.round(factRev/art.plan_rev*100):0;
      const pctSls=art.plan_buy?Math.round(factSls/art.plan_buy*100):0;
      const dayVals=days.map(day=>getV(art,day,CM==='all'?'revenue':CM));
      const wowMetric=CM==='all'?'revenue':CM;
      const l5=wdo.slice(-5).map(dv=>getV(art,dv,wowMetric)).filter(v=>v>0);
      const p5=wdo.slice(-10,-5).map(dv=>getV(art,dv,wowMetric)).filter(v=>v>0);
      const l5a=l5.length?l5.reduce((a,b)=>a+b)/l5.length:0;
      const p5a=p5.length?p5.reduce((a,b)=>a+b)/p5.length:0;
      const wow=p5a?Math.round((l5a-p5a)/p5a*100):0;
      const wowBad=CM==='drr'?wow>0:wow<0;
      dayVals.forEach((v,i)=>{if(!days[i].off)dayTotals[i]+=v;});
      // artDayGated — один и тот же per-day gateDay() массив используется и для накопления
      // dayTotalsAll (итоговая строка), и для под-строк метрик этого артикула ниже —
      // раньше считался дважды (тут и внутри dayAllHTML на каждую ячейку).
      let artDayGated=null, artCum=null;
      if(CM==='all'){
        artDayGated=days.map(day=>day.off?null:gateDay(art.days[day.d],art.cogs,art.ft_gross_rev));
        artCum={ord:0,sls:0,rev:0,ret:0,spend:0,comm:0,logi:0,acq:0,cogs:0,ftrev:0,
          adShows:0,adClicks:0,adCart:0,adOrders:0,totalShows:0,totalCart:0,totalOrders:0,cancelled:0};
        artDayGated.forEach((d,i)=>{
          if(!d)return;
          const t=dayTotalsAll[i];
          t.ord+=d.ord;t.sls+=d.sls;t.rev+=d.rev;t.ret+=d.ret;t.spend+=d.spend;
          t.comm+=d.comm;t.logi+=d.logi;t.acq+=d.acq;t.cogs+=d.cogs;t.ftrev+=d.ftrev;t.mrev+=d.mrev;
          t.adShows+=d.adShows;t.adClicks+=d.adClicks;t.adCart+=d.adCart;t.adOrders+=d.adOrders;
          t.totalShows+=d.totalShows;t.totalCart+=d.totalCart;t.totalOrders+=d.totalOrders;t.cancelled+=d.cancelled;
          // Остаток дня СУММИРУЕМ ПО АРТИКУЛАМ для строки "Итого" (сколько всего на
          // складе за этот день) — но НЕ включаем stockQty в artCum ниже (тот копится
          // generic-циклом по дням периода — суммировать остатки по дням бессмысленно,
          // см. cumMode:'last' у METRIC_ROWS).
          t.stockQty+=d.stockQty;
          for(const k in artCum)artCum[k]+=d[k]||0;
        });
      }

      // mkPR — вынесен на верхний уровень (см. рядом с fmtMetric), т.к. теперь
      // используется и строкой категории (выше по коду), не только артикулом.
      const prOrd = mkPR('Заказы',  factOrd, art.plan_ord, v => v||0);
      const prSls = mkPR('Продажи', factSls, art.plan_buy, v => v||0);
      const prRev = mkPR('Выручка', factRev, art.plan_rev, v=>Nf(v)+'₽');
      const prAvg = factSls > 0
        ? `<div class="pr-row"><span class="pr-lbl">Ср. чек</span><span class="pr-fact">${Nf(factRev/factSls)}₽</span></div>`
        : '';
      const prDrr = factSpend > 0
        ? `<div class="pr-row"><span class="pr-lbl">ДРР</span><span class="pr-fact">${Nf(factSpend)}₽</span><span class="pr-pct ${art.plan_drr>0&&factDrr>art.plan_drr?'nv':'pv'}" style="background:var(--color-background-warning);color:var(--color-text-warning)">${factDrr}%</span>${art.plan_drr>0?`<span class="pr-sep">/</span><span class="pr-plan">${art.plan_drr}%</span>`:''}</div>`
        : '';

      // Комиссия, эквайринг и логистика — ТОЧНЫЕ суммы за видимый период (factComm/factAcq/
      // factLogi, из artPre, уважают выбор недели), не art.commission_sum/acquiring_sum/
      // logistics_sum (те всегда за весь месяц — при выборе недели давали рассинхрон
      // масштабов и заниженный расход при прорейтинге в ЧП, вплоть до фейковых ~100%).
      const comm = factComm;
      const acq  = factAcq;
      const logi = factLogi;
      const gross = factGross;
      const commPct = art.commission_pct > 0 ? art.commission_pct.toFixed(1) : (gross > 0 ? (comm / gross * 100).toFixed(1) : null);
      const acqPct  = gross > 0 ? (acq  / gross * 100).toFixed(1) : null;
      const logiPct = gross > 0 ? (logi / gross * 100).toFixed(1) : null;
      // План по комиссии/логистике — из %% плана (art.plan_comm_pct/plan_logi_pct,
      // 24.09.2026, требует migration_plan_pct_fields.sql) × план-выручка, та же
      // логика, что у факта (comm/gross → %, тут наоборот %×revenue → ₽), чтобы
      // сравнивать ₽ с ₽, а не смешивать % плана с ₽ факта.
      const planComm = art.plan_rev>0 && art.plan_comm_pct>0 ? art.plan_rev*art.plan_comm_pct/100 : 0;
      const planLogi = art.plan_rev>0 && art.plan_logi_pct>0 ? art.plan_rev*art.plan_logi_pct/100 : 0;
      const prComm = comm > 0
        ? `<div class="pr-row"><span class="pr-lbl">Комиссия</span><span class="pr-fact">${Nf(comm)}₽</span>${commPct?`<span class="pr-pct" style="background:var(--color-background-warning);color:var(--color-text-warning)">${commPct}%</span>`:''}${planComm>0?`<span class="pr-sep">/</span><span class="pr-plan">${Nf(planComm)}₽</span>`:''}</div>`
        : '';
      const prAcq = acq > 0
        ? `<div class="pr-row"><span class="pr-lbl">Эквайринг</span><span class="pr-fact">${Nf(acq)}₽</span>${acqPct?`<span class="pr-pct" style="background:var(--color-background-warning);color:var(--color-text-warning)">${acqPct}%</span>`:''}</div>`
        : '';
      const prLogi = logi > 0
        ? `<div class="pr-row"><span class="pr-lbl">Логистика</span><span class="pr-fact">${Nf(logi)}₽</span>${logiPct?`<span class="pr-pct" style="background:var(--color-background-warning);color:var(--color-text-warning)">${logiPct}%</span>`:''}${planLogi>0?`<span class="pr-sep">/</span><span class="pr-plan">${Nf(planLogi)}₽</span>`:''}</div>`
        : '';

      // ЧП = Выручка - С/С×Продажи - Реклама - Комиссия - Эквайринг - Логистика.
      // Все компоненты точные за видимый период (см. artPre) — без прорейтинга по ratio,
      // который раньше смешивал масштаб недели (выручка) с масштабом месяца (комиссия/
      // эквайринг/логистика из art.*_sum) при выбранной неделе.
      let prNp = '';
      if (factRev > 0 && art.cogs > 0) {
        const np = factRev - art.cogs * factSls - factSpend - comm - acq - logi;
        const npPct = (np / factRev * 100).toFixed(1);
        const npCls = np >= 0 ? 'pv' : 'nv';
        // План ЧП = план-выручка − план-себестоимость×план-продажи − план-реклама
        // − план-комиссия − план-логистика (эквайринг в плане не задают — не
        // собирается со стороны продавца отдельным полем, эквайринг ниоткуда
        // не берём и в плане ЧП не вычитаем, как и Эквайринг не показан с планом выше).
        const planNp = art.plan_rev>0
          ? art.plan_rev - art.plan_vc*art.plan_buy - art.plan_spend - planComm - planLogi
          : 0;
        const planNpPart = planNp!==0?`<span class="pr-sep">/</span><span class="pr-plan">${Nf(planNp)}₽</span>`:'';
        prNp = `<div class="pr-row"><span class="pr-lbl">ЧП</span><span class="pr-fact ${npCls}">${Nf(np)}₽</span><span class="pr-pct ${npCls}" style="background:${np>=0?'var(--color-background-success, #e6f4ea)':'var(--color-background-error, #fce8e6)'};color:${np>=0?'var(--color-text-success, #137333)':'var(--color-text-error, #c5221f)'}">${npPct}%</span>${planNpPart}</div>`;
      }

      const hasPrData = prOrd || prSls || prRev;
      const artPlanAgg = buildPlanAgg([art]);
      // Режим "Все": s2 — единственное место с подписями (все 18 метрик, не только
      // те 9 что имеют план), ячейки дней ниже — те же метрики без подписей.
      const sm = CM==='all' ? staticLabelBlockHTML(artDayGated,artCum,artPlanAgg,periodDays,daysInMonth) : hasPrData
        ? `<div class="pr-wrap">${prOrd}${prSls}${prRev}${prAvg}${prNp}${prDrr}${prComm}${prAcq}${prLogi}</div>`
        : `<span class="pr-noplan">нет плана</span>`;

      const photoSrc=art.photo_url||(CMP==='wb'?wbPhotoUrl(art.marketplace_id):null);
      const photoCell=photoSrc
        ?`<img src="${photoSrc}" width="56" height="68"
            style="border-radius:4px;object-fit:cover;display:block"
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'photo-ph',style:'background:${cc};width:56px;height:68px;border-radius:4px'}))">`
        :`<div class="photo-ph" style="background:${cc};width:56px;height:68px;border-radius:4px;display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          </div>`;
      const artKey=art.name.replace(/'/g,"\\'");
      html+=`<tr class="art-row" data-cat="${catId}" style="${isCollapsed?'display:none':''}">
        <td class="s0">${photoCell}</td>
        <td class="s1"><div style="display:flex;align-items:center;gap:3px"><span class="art-name" title="${art.name}" style="max-width:${CM==='all'?'190px':'210px'}">${art.name}</span></div>
          ${commentFieldHTML(art.name,artKey,MP_DB[CMP]||CMP)}</td>
        <td class="s2 plan-col"><div class="pf-cell">${sm}</div></td>`;
      weekGroups.forEach((wg,wi)=>{
        const collapsed=!!WEEK_COLLAPSED[wg.wk];
        const wkDayList=wg.days.map(x=>x.day);
        const wkSepCls=wi>0?' wk-sep':'';
        if(CM==='all'){
          html+=`<td class="all-cell wk-total${wkSepCls}">${compactDayValuesHTML(calcGatedWeekCum([art],wkDayList),artPlanAgg,wg.days.length,daysInMonth,false)}</td>`;
        }else{
          const wv=statValueForMetric(calcStats([art],wkDayList),CM);
          html+=`<td class="wk-total${wkSepCls}"><span class="dv">${fmtV(wv,CM)}</span></td>`;
        }
        if(!collapsed)wg.days.forEach(({day,di})=>{
          if(CM==='all'){
            html+=`<td class="all-cell${day.off?' off-day':''}">${day.off?'—':compactDayValuesHTML(artDayGated[di],artPlanAgg,1,daysInMonth,true)}</td>`;
          }else{
            const v=getV(art,day,CM);
            html+=`<td class="${day.off?'':heatCls(v,CM,gMin,gMax)}${day.off?' off-day':''}"><span class="dv">${day.off?'—':fmtV(v,CM)}</span></td>`;
          }
        });
      });
      html+=`<td class="spark-td" title="Открыть график"
        onclick="openTrend('${MP_DB[CMP]||CMP}','${art.name.replace(/'/g,"\\'")}',null,false)">${sparkSVG(dayVals,col)}</td>
        <td style="text-align:center"><span style="font-size:10px;padding:1px 4px;border-radius:5px;${wow===0?'color:var(--color-text-tertiary)':wowBad?'background:var(--color-background-danger);color:var(--color-text-danger)':'background:var(--color-background-success);color:var(--color-text-success)'}">${wow===0?'—':(wow>0?'+':'')+wow+'%'}</span></td>
      </tr>`;
    });
  });

  let totalCum=null;
  if(CM==='all'){
    totalCum={ord:0,sls:0,rev:0,ret:0,spend:0,comm:0,logi:0,acq:0,cogs:0,ftrev:0,
      adShows:0,adClicks:0,adCart:0,adOrders:0,totalShows:0,totalCart:0,totalOrders:0,cancelled:0};
    dayTotalsAll.forEach(o=>{if(!o)return;for(const k in totalCum)totalCum[k]+=o[k]||0;});
  }
  const totalPlanAgg=buildPlanAgg(displayArts);
  html+=`<tr class="total-row">
    <td class="s0"></td><td class="s1" style="padding-left:8px">Итого</td>
    <td class="s2 plan-col">${CM==='all'?staticLabelBlockHTML(dayTotalsAll,totalCum,totalPlanAgg,periodDays,daysInMonth):''}</td>`;
  weekGroups.forEach((wg,wi)=>{
    const collapsed=!!WEEK_COLLAPSED[wg.wk];
    const wkDayList=wg.days.map(x=>x.day);
    const wkSepCls=wi>0?' wk-sep':'';
    if(CM==='all'){
      html+=`<td class="all-cell wk-total${wkSepCls}">${compactDayValuesHTML(calcGatedWeekCum(displayArts,wkDayList),totalPlanAgg,wg.days.length,daysInMonth,false)}</td>`;
    }else{
      const wv=statValueForMetric(calcStats(displayArts,wkDayList),CM);
      html+=`<td class="wk-total${wkSepCls}" style="text-align:center">${fmtV(wv,CM)}</td>`;
    }
    if(!collapsed)wg.days.forEach(({day,di})=>{
      if(CM==='all'){
        html+=`<td class="all-cell${day.off?' off-day':''}">${day.off?'—':compactDayValuesHTML(dayTotalsAll[di],totalPlanAgg,1,daysInMonth,true)}</td>`;
      }else{
        html+=`<td class="${day.off?' off-day':''}" style="text-align:center">${day.off?'—':fmtV(dayTotals[di],CM)}</td>`;
      }
    });
  });
  html+=`<td></td><td></td></tr>`;
  html+=`</tbody></table>`;
  document.getElementById('tbl-container').innerHTML=html;
}

// ─── Auth listener ────────────────────────────────────────────
// Роль — из app_metadata (не user_metadata: ту юзер может переписать себе сам
// через auth.updateUser(), app_metadata — только Admin API/service_role).
// Нет роли вообще (старые аккаунты, созданные до этой фичи) = admin, чтобы никого
// не отрезать от уже работавшего доступа задним числом.
function applyRoleGating(session){
  const role=session?.user?.app_metadata?.role||'admin';
  document.querySelectorAll('.admin-link').forEach(el=>{
    el.style.display=(role==='viewer')?'none':'';
  });
}

// Токен реальной сессии — нужен для запросов к articles/article_comments
// (RLS-политики там TO authenticated, не anon). SB_ANON годится только для
// таблиц/вьюх с политикой TO anon (v_daily_dashboard, sync_log и т.п.).
let CURRENT_SESSION=null;
function authToken(){return CURRENT_SESSION?.access_token||SB_ANON;}

let _initing=false;
async function initApp(session){
  if(_initing)return;
  _initing=true;
  CURRENT_SESSION=session;
  applyRoleGating(session);
  document.getElementById('login-overlay').style.display='none';
  document.getElementById('app').style.display='block';
  try{
    await Promise.all([
      populateMonthSel(),
      loadVisibilityRules(),
      loadComments(),
    ]);
    await reloadData();
  }catch(e){
    console.error('initApp error:',e);
    document.getElementById('tbl-container').innerHTML=
      `<p style="padding:20px;color:#e24b4a;font-size:12px">Ошибка: ${e.message}</p>`;
    showLoading(false);
  }
  _initing=false;
}

sb.auth.onAuthStateChange(async(event,session)=>{
  if(session){
    await initApp(session);
  }else{
    CURRENT_SESSION=null;
    document.getElementById('login-overlay').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

// Принудительная проверка сессии при загрузке страницы
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  console.log('initial session:', !!session);
  if(session) await initApp(session);
})();
</script>
