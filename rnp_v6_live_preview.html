<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABELLO — Аналитика</title>
<style>
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --border-radius-md:6px;
  --border-radius-lg:8px;
  --color-background-primary:#ffffff;
  --color-background-secondary:#f7f7f7;
  --color-text-primary:#111111;
  --color-text-secondary:#555555;
  --color-text-tertiary:#999999;
  --color-border-secondary:#e2e2e2;
  --color-border-tertiary:#eeeeee;
  --color-text-success:#1d9e75;
  --color-background-success:rgba(29,158,117,0.10);
  --color-text-danger:#e24b4a;
  --color-background-danger:rgba(226,75,74,0.10);
  --color-text-warning:#d97706;
  --color-background-warning:rgba(217,119,6,0.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-primary)}

/* ── Login ──────────────────────────────────────────── */
#login-overlay{
  position:fixed;inset:0;background:#f5f5f5;
  display:flex;align-items:center;justify-content:center;z-index:999
}
.lcard{
  background:#fff;border:1px solid #e5e5e5;border-radius:12px;
  padding:32px 28px;width:320px;box-shadow:0 4px 24px rgba(0,0,0,0.06)
}
.lcard h2{font-size:15px;font-weight:600;color:#111;margin-bottom:4px}
.lcard p{font-size:12px;color:#999;margin-bottom:20px}
.lcard input{
  width:100%;padding:8px 10px;border:1px solid #e2e2e2;
  border-radius:6px;font-size:13px;margin-bottom:10px;outline:none;
  font-family:var(--font-sans)
}
.lcard input:focus{border-color:#555}
.lbtn{
  width:100%;padding:9px;background:#111;color:#fff;border:none;
  border-radius:6px;font-size:13px;cursor:pointer;font-weight:500;
  font-family:var(--font-sans)
}
.lbtn:hover{background:#333}
.lerr{font-size:11px;color:#e24b4a;margin-top:8px;min-height:16px}

/* ── Loading ────────────────────────────────────────── */
#loading{
  position:fixed;inset:0;background:rgba(255,255,255,0.85);
  display:none;align-items:center;justify-content:center;z-index:100;
  font-size:13px;color:#999;font-family:var(--font-sans)
}

/* ── App ────────────────────────────────────────────── */
#app{padding:12px 16px;display:none}

/* ── Dashboard CSS (оригинал, без изменений) ──────── */
.w{padding:.75rem 0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.mptabs{display:flex;gap:5px}
.mpt{padding:4px 14px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:transparent;font-size:12px;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans)}
.mpt.wb{background:#CB11AB;border-color:#CB11AB;color:#fff}
.mpt.oz{background:#005bff;border-color:#005bff;color:#fff}
.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sel{padding:4px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);font-size:11px;background:var(--color-background-secondary);color:var(--color-text-primary);font-family:var(--font-sans)}
.kstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:1rem}
#kpi-breakdown.hidden{display:none}
.kc{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:8px 10px}
.kl{font-size:10px;color:var(--color-text-tertiary);margin-bottom:1px}
.kv{font-size:16px;font-weight:500;color:var(--color-text-primary);line-height:1.1}
.krow{display:flex;align-items:center;gap:4px;margin-top:3px}
.kp{font-size:10px;color:var(--color-text-tertiary)}
.bd{font-size:10px;padding:1px 5px;border-radius:6px;font-weight:500}
.bd.ok{background:var(--color-background-success);color:var(--color-text-success)}
.bd.warn{background:rgba(217,119,6,.12);color:var(--color-text-warning)}
.bd.err{background:var(--color-background-danger);color:var(--color-text-danger)}
.kpbar{height:3px;background:var(--color-border-tertiary);border-radius:2px;margin-top:5px;overflow:hidden}
.kpfill{height:100%;border-radius:2px;transition:width .4s}
.bp{background:var(--color-background-success);color:var(--color-text-success)}
.bn{background:var(--color-background-danger);color:var(--color-text-danger)}
.mrow{display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;padding-bottom:2px}
.mt{font-size:11px;padding:4px 11px;border-radius:14px;border:0.5px solid var(--color-border-secondary);background:transparent;cursor:pointer;color:var(--color-text-secondary);white-space:nowrap;font-family:var(--font-sans)}
.mt.on{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.tbl-wrap{overflow-x:auto;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg)}
table.main{border-collapse:collapse;width:100%;font-size:11px}
table.main th.s0,table.main td.s0{position:sticky;left:0;z-index:3;background:var(--color-background-primary);min-width:64px;max-width:64px;width:64px}
table.main th.s1,table.main td.s1{position:sticky;left:64px;z-index:3;background:var(--color-background-primary);min-width:220px;max-width:220px;width:220px}
table.main th.s2,table.main td.s2{position:sticky;left:284px;z-index:3;background:var(--color-background-primary);min-width:148px}
table.main thead th{font-size:10px;color:var(--color-text-tertiary);font-weight:500;padding:5px 6px;border-bottom:0.5px solid var(--color-border-tertiary);text-align:center;white-space:nowrap;background:var(--color-background-primary)}
/* thead th.s0/s1/s2 получали ЗАОДНО и top:0 от общего правила выше (у них уже
   position:sticky для горизонтального left-стика) — только у этих трёх столбцов
   шапка залипала ещё и по вертикали, а "Нед."/дни (position:static, top:0 без
   эффекта) — нет. На скролле страницы шапка рвалась ровно на стыке между
   ними — видимая "ступенька". Полноценный вертикальный sticky не просили,
   просто убираем top отдельно для этих трёх, оставляя левый sticky как есть. */
table.main thead th.s0,table.main thead th.s1,table.main thead th.s2{top:auto}
table.main thead th.s0,table.main thead th.s1,table.main thead th.s2{z-index:4;text-align:left}
table.main thead th.plan-col{background:var(--color-background-secondary);color:var(--color-text-tertiary)}
table.main thead th.day-hdr{min-width:34px}
table.main thead th.wk-hdr{background:var(--color-background-secondary);font-size:9px;color:var(--color-text-tertiary);border-left:1px solid var(--color-border-tertiary);border-right:1px solid var(--color-border-tertiary)}
table.main tr.cat-row td{background:var(--color-background-secondary);font-size:10px;font-weight:500;color:var(--color-text-secondary);padding:4px 8px;border-bottom:0.5px solid var(--color-border-secondary)}
table.main tr.cat-row td.s0,table.main tr.cat-row td.s1,table.main tr.cat-row td.s2{background:var(--color-background-secondary)}
table.main tr.cat-row{cursor:pointer;user-select:none}
table.main tr.cat-row:hover td{filter:brightness(0.97)}
table.main tr.cat-row td.cat-toggle{text-align:center;font-size:10px;color:var(--color-text-tertiary);padding:4px}
table.main tr.cat-row td.cat-sub{text-align:center;font-size:10px;font-weight:600;color:var(--color-text-primary)}
table.main tr.art-row td{padding:4px 5px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle;text-align:center}
table.main tr.art-row:hover td{background:rgba(128,128,128,0.04)}
table.main tr.art-row:hover td.s0,table.main tr.art-row:hover td.s1,table.main tr.art-row:hover td.s2{background:var(--color-background-secondary)}
table.main tr.art-row td.s0,table.main tr.art-row td.s1,table.main tr.art-row td.s2{text-align:left;vertical-align:top}
.photo-ph{width:56px;height:68px;border-radius:4px;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center}
.art-name{font-size:11px;color:var(--color-text-primary);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px;line-height:16px}
.art-comment-input{display:block;box-sizing:border-box;width:100%;max-width:210px;margin-top:3px;font-size:10px;
  padding:4px 6px;border:1px solid var(--color-border-secondary);border-radius:4px;resize:vertical;
  background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
.art-comment-input::placeholder{color:var(--color-text-tertiary);font-style:italic}
/* Старые стили (оставляем для совместимости) */
.pf-cell{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:2px 6px;width:100%}
.pf-fact{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.pf-plan{font-size:9px;color:var(--color-text-tertiary)}
.pf-bar{width:100%;height:3px;background:var(--color-background-secondary);border-radius:2px;margin-top:2px;position:relative;overflow:hidden}
.pf-fill{height:100%;border-radius:2px;position:absolute;top:0;left:0}
/* Новая постоянная сводка факт/план */
.pr-wrap{display:flex;flex-direction:column;gap:4px;padding:3px 6px;width:100%}
.pr-row{display:flex;align-items:center;gap:3px;white-space:nowrap;font-size:11px}
.pr-lbl{font-size:9px;color:var(--color-text-tertiary);width:46px;flex-shrink:0}
.pr-fact{font-weight:600;color:var(--color-text-primary);min-width:22px}
.pr-sep{color:var(--color-text-tertiary);margin:0 1px;font-size:9px}
.pr-plan{color:var(--color-text-secondary);font-size:10px}
.pr-pct{font-size:9px;padding:0 4px;border-radius:4px;margin-left:2px;font-weight:500}
.pr-pct.pv{background:var(--color-background-success);color:var(--color-text-success)}
.pr-pct.nw{background:var(--color-background-warning);color:var(--color-text-warning)}
.pr-pct.nv{background:var(--color-background-danger);color:var(--color-text-danger)}
.pr-noplan{font-size:9px;color:var(--color-text-tertiary);padding:4px 6px;font-style:italic}
/* Режим "Все": строки s2 (подписи+накопительно) и строки в каждой ячейке дня (голые
   числа) должны идти день-в-день на одной высоте — иначе на 5-6 строке вниз подпись
   слева уезжает от своего числа в ячейке дня (реальный баг, найден по скриншоту).
   Поэтому .mline/.msep — ОДИН набор классов без per-контекстных переопределений
   font-size/gap (в отличие от .pr-row/.pr-wrap выше, у тех есть td.all-cell override) —
   используется и в s2 (staticLabelBlockHTML), и в ячейках дня (compactDayValuesHTML),
   высота гарантированно совпадает. "—" рендерится всегда, ни одна строка не пропускается.
   НЕ .mrow — это имя уже занято (см. строку 87, полоска кнопок-метрик наверху,
   .mrow{overflow-x:auto;...}) — коллизия имён включала horizontal-scroll на каждой из
   тысяч крошечных строк, что рисовало стрелки прокрутки на каждой ячейке (реальный
   баг, найден через getComputedStyle — .mrow-fact наследовал overflow:auto от чужого
   правила). */
.mline-wrap{display:flex;flex-direction:column;width:100%}
/* CSS GRID, не flex — 25.09.2026: на flex план/откл. "плясали" между строками
   (нашли по фидбеку пользователя), т.к. %%-бейдж (см. pctBadgeHTML) есть
   ТОЛЬКО у части строк (ДРР/Комиссия/Эквайринг/Логистика/ЧП/Возврат) и его
   переменная ширина сдвигала всё, что после него, вправо — у строк БЕЗ
   бейджа план/откл. вставали на другое место. Grid с фикс. колонками решает
   это раз и навсегда: бейдж — своя колонка, пустая у строк без него, но
   МЕСТО зарезервировано всегда. .mline (ячейка дня/недели, 4 колонки, без
   подписи) и .mline.has-lbl (s2, 5 колонок, с подписью слева) — разные
   шаблоны, т.к. в дне/неделе подписи нет вообще (см. compactDayValuesHTML).*/
.mline{display:grid;grid-template-columns:60px 34px 60px 56px;align-items:center;column-gap:3px;white-space:nowrap;min-height:16px;font-size:10px;line-height:16px}
.mline.has-lbl{grid-template-columns:64px 60px 34px 60px 56px}
.mline.f2{grid-template-columns:60px 34px}
.mline-lbl{color:var(--color-text-tertiary);overflow:hidden;text-overflow:ellipsis}
/* Факт/Бейдж/План/Откл. — САМОСТОЯТЕЛЬНЫЕ выровненные колонки (не текст
   вподбор) — 24.09.2026, по явной просьбе пользователя (было "факт / план
   43.5%" одной строкой текста). У строк без плана (Возврат/Ср.чек/Эквайринг/
   Реклама и т.п.) план/откл. рендерятся как "—", а не пропускаются.
   ВАЖНО: .mline-fact используется и в compactDayValuesHTML (ячейка дня —
   там всего 2 колонки, .mline.f2, план/откл. туда не подставляются вообще,
   см. коммент у функции — по просьбе пользователя убрана "полная сводка"
   по всем метрикам в узкой ячейке одного дня, там только факт+бейдж).*/
.mline-fact{font-weight:500;color:var(--color-text-primary);text-align:right}
.mline-badge{text-align:right;overflow:hidden}
.mline-plan{color:var(--color-text-tertiary);font-size:9px;text-align:right}
.mline-dev{font-size:9px;font-weight:500;text-align:right;padding:0 2px;border-radius:3px;box-sizing:border-box}
/* Фон блока по группе метрик — визуально отделяет "Реклама" от "Итого (реклама+
   органика)" от базовых метрик и от "Склад", вместо одинаковых на вид строк подряд. */
.mgroup{padding:1px 3px;margin:0 -3px;border-radius:3px}
.mgroup-core{background:rgba(128,128,128,.05)}
.mgroup-ads{background:rgba(0,91,255,.06)}
.mgroup-total{background:rgba(29,158,117,.07)}
.mgroup-stock{background:rgba(217,119,6,.07)}
.mgroup-plan{background:rgba(0,91,255,.1)}
.mline-dev.pv{color:var(--color-text-success);background:var(--color-background-success)}
.mline-dev.nv{color:var(--color-text-danger);background:var(--color-background-danger)}
.msep{min-height:14px;line-height:14px;font-size:7px;color:var(--color-text-tertiary);
  text-transform:uppercase;letter-spacing:.02em;border-top:1px dashed var(--color-border-tertiary);
  box-sizing:border-box;white-space:nowrap}
.dv{font-size:11px;font-weight:500;display:block;line-height:1.1}
td.all-cell{text-align:left!important;vertical-align:top;padding:2px 4px!important;min-width:96px}
td.all-cell .pr-wrap{padding:2px 3px;gap:1px}
td.all-cell .pr-row{font-size:10px;gap:2px}
td.all-cell .pr-lbl{width:26px;font-size:8px}
td.all-cell .pr-fact{min-width:0;font-size:10px}
td.all-cell .pr-pct{font-size:8px;padding:0 3px}
.pr-sep{font-size:8px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.02em;
  margin-top:3px;padding-top:3px;border-top:1px dashed var(--color-border-tertiary)}
td.all-cell .pr-sep{font-size:7px;margin-top:2px;padding-top:2px}
.dv-empty{color:var(--color-text-tertiary);font-size:11px}
td.off-day{opacity:.3}
.h1g{background:rgba(29,158,117,.07)}.h2g{background:rgba(29,158,117,.15)}.h3g{background:rgba(29,158,117,.24)}
.h1r{background:rgba(226,75,74,.07)}.h2r{background:rgba(226,75,74,.15)}.h3r{background:rgba(226,75,74,.24)}
td.spark-td{padding:2px 5px!important}
td.wk-sep,th.wk-sep{border-left:1px solid var(--color-border-secondary)!important}
/* Столбец "Итого нед." — лёгкий фон, чтобы отличать от обычных дневных столбцов
   (и чтобы было видно на глаз, где неделя свёрнута до одного столбца). */
td.wk-total,th.wk-total-hdr{background:var(--color-background-secondary)}
tr.art-row td.wk-total{font-weight:600}
th.wk-total-hdr{font-size:9px;color:var(--color-text-tertiary)}
tr.total-row td{font-weight:500;border-top:1.5px solid var(--color-border-secondary);background:var(--color-background-secondary);font-size:11px}
tr.total-row td.s0,tr.total-row td.s1,tr.total-row td.s2{background:var(--color-background-secondary)}
.pv{color:var(--color-text-success)}.nv{color:var(--color-text-danger)}
@media(max-width:800px){.kstrip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.kstrip{grid-template-columns:repeat(2,1fr)}}

/* ── Тренд: модалка с настраиваемым графиком по позиции/категории ── */
td.spark-td,td.trend-cell{cursor:pointer}
td.spark-td:hover,td.trend-cell:hover{background:var(--color-background-secondary)!important}
#trend-modal{position:fixed;inset:0;z-index:998;display:none}
.trend-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.45)}
.trend-panel{position:absolute;top:3%;left:50%;transform:translateX(-50%);width:min(960px,94vw);max-height:94vh;
  overflow-y:auto;background:var(--color-background-primary);border-radius:var(--border-radius-lg);
  box-shadow:0 12px 40px rgba(0,0,0,0.25);padding:18px 20px}
.trend-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.trend-title{font-size:15px;font-weight:600;color:var(--color-text-primary)}
.trend-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.trend-close{font-size:12px;padding:6px 12px;border-radius:8px;border:0.5px solid var(--color-border-secondary);
  background:var(--color-text-primary);color:var(--color-background-primary);cursor:pointer;white-space:nowrap;font-family:var(--font-sans)}
.trend-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:10px;padding-bottom:10px;
  border-bottom:0.5px solid var(--color-border-tertiary)}
.trend-group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.trend-group .glbl{font-size:10px;color:var(--color-text-tertiary);margin-right:2px}
.trend-btn{font-size:11px;padding:4px 10px;border-radius:12px;border:0.5px solid var(--color-border-secondary);
  background:transparent;cursor:pointer;color:var(--color-text-secondary);white-space:nowrap;font-family:var(--font-sans)}
.trend-btn.on{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.trend-custom input[type=date]{font-size:11px;padding:3px 6px;border-radius:6px;border:0.5px solid var(--color-border-secondary);
  background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
.trend-metrics{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.trend-chart-wrap{position:relative;width:100%}
.trend-chart-wrap svg{width:100%;height:280px;display:block;overflow:visible}
.trend-tooltip{position:absolute;pointer-events:none;background:var(--color-background-primary);
  border:0.5px solid var(--color-border-secondary);border-radius:8px;padding:8px 10px;font-size:11px;
  box-shadow:0 4px 16px rgba(0,0,0,0.18);white-space:nowrap;z-index:5}
.trend-tooltip .tt-date{font-weight:600;color:var(--color-text-primary);margin-bottom:4px}
.trend-tooltip .tt-row{display:flex;justify-content:space-between;gap:14px;color:var(--color-text-secondary)}
.trend-tooltip .tt-row b{color:var(--color-text-primary);font-weight:600}
.trend-summary{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:0.5px solid var(--color-border-tertiary)}
.trend-sum-item{font-size:11px;color:var(--color-text-tertiary)}
.trend-sum-item b{display:block;font-size:14px;color:var(--color-text-primary);font-weight:600;margin-top:2px}
.trend-empty{padding:40px 0;text-align:center;color:var(--color-text-tertiary);font-size:12px}
</style>
</head>
<body>

<!-- ── Login ──────────────────────────────────────────────── -->
<div id="login-overlay">
  <div class="lcard">
    <h2>ABELLO Analytics</h2>
    <p>Войдите чтобы продолжить</p>
    <input type="email"    id="li-email" placeholder="Email"  autocomplete="email">

// ─── Helpers ─────────────────────────────────────────────────
const Nf = n => (!n||n===0)?'—':Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');

// ─── Data loading (чистый fetch, без Supabase JS клиента) ────
const SB_URL='https://lxmewaxdkjvpkoaoghxp.supabase.co';
const SB_ANON='sb_publishable_Txyv_RuL8aR6OIACwPH1Hg_bKmqu6FA';

async function sbFetch(table, params){
  const url=`${SB_URL}/rest/v1/${table}?${params}`;
  const r=await fetch(url,{headers:{
    'apikey': SB_ANON,
    'Authorization': `Bearer ${SB_ANON}`,
  }});
  if(!r.ok){const t=await r.text();throw new Error(`${r.status}: ${t}`);}

}

async function loadMonthData(mp,year,month){
  const pad=n=>String(n).padStart(2,'0');
  const start=`${year}-${pad(month)}-01`;
  const last=new Date(year,month,0).getDate();
  const end=`${year}-${pad(month)}-${pad(last)}`;
  const mp_db=MP_DB[mp]||mp;
  // PostgREST/Supabase молча режет ответ до своего серверного максимума строк (обычно 1000),
  // даже если в URL стоит limit=5000 — при сортировке по category это тихо обрезало
  // алфавитно последние категории (напр. "Шубы" пропадали целиком при большом месяце).
  // Поэтому пагинируем сами через offset, пока не придёт страница короче pageSize.
  const baseUrl=`${SB_URL}/rest/v1/v_daily_dashboard?marketplace=eq.${mp_db}&date=gte.${start}&date=lte.${end}&order=category,seller_article,date`;
  const pageSize=1000;
  let all=[];
  let offset=0;
  while(true){
    const url=`${baseUrl}&limit=${pageSize}&offset=${offset}`;
    const r=await fetch(url,{headers:{'apikey':SB_ANON,'Authorization':`Bearer ${SB_ANON}`}});
    if(!r.ok){const t=await r.text();throw new Error(`loadMonthData ${r.status}: ${t}`);}
    const batch=await r.json();
    all=all.concat(batch);
    if(batch.length<pageSize) break;
    offset+=pageSize;
  }
  return all;
}

// ─── Комментарии к артикулам ───────────────────────────────────
let COMMENTS={}; // seller_article -> {comment, article_id}

async function loadComments(){
  try{
    const url=`${SB_URL}/rest/v1/article_comments?select=id,article_id,comment,articles(seller_article,marketplace)&limit=5000`;
    const r=await fetch(url,{headers:{'apikey':SB_ANON,'Authorization':`Bearer ${authToken()}`}});
    if(!r.ok)return;
    const data=await r.json();
    COMMENTS={};
    for(const row of data){
      if(row.articles) COMMENTS[row.articles.seller_article]={comment:row.comment,article_id:row.article_id};
    }
  }catch(e){
    console.warn('loadComments error:',e);

}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Обычное редактируемое поле комментария в строке артикула — прямоугольный
// textarea, всегда видимый (не hover-иконка, не prompt(), не click-to-edit).
function commentFieldHTML(sellerArticle,artKey,mp){
  const cur=COMMENTS[sellerArticle];
  const text=cur?cur.comment:'';
  const mpKey=mp.replace(/'/g,"\\'");
  return `<textarea class="art-comment-input" rows="10" placeholder="+ комментарий"
    onclick="event.stopPropagation()"
    onblur="saveComment(this,'${artKey}','${mpKey}')">${escapeHtml(text)}</textarea>`;
}

async function saveComment(textarea,sellerArticle,mp){
  const text=textarea.value;
  const cur=COMMENTS[sellerArticle];
  if(text.trim()===(cur?cur.comment:'')){return;} // не менялось — не дёргаем сеть
  try{
    let articleId=cur?cur.article_id:null;
    if(!articleId){
      const r=await fetch(`${SB_URL}/rest/v1/articles?select=id&seller_article=eq.${encodeURIComponent(sellerArticle)}&marketplace=eq.${encodeURIComponent(mp)}`,
        {headers:{'apikey':SB_ANON,'Authorization':`Bearer ${authToken()}`}});
      const rows=await r.json();
      if(!rows.length){alert('Артикул не найден в справочнике');render();return;}
      articleId=rows[0].id;
    }
    if(!text.trim()){
      const r=await fetch(`${SB_URL}/rest/v1/article_comments?article_id=eq.${articleId}`,
        {method:'DELETE',headers:{'apikey':SB_ANON,'Authorization':`Bearer ${authToken()}`}});
      // fetch() НЕ бросает исключение на HTTP-ошибку (403/500/...) — только на обрыв
      // сети. Раньше статус ответа тут не проверялся: при истёкшей сессии/сбое RLS
      // запрос молча проваливался на сервере, а код всё равно считал, что сохранил —
      // текст пропадал только при следующей перезагрузке (loadComments), без единой
      // ошибки в моменте. Нашли на реальном кейсе "не сохраняет большие комментарии"
      // (длинный текст = дольше запрос = больше шанс поймать сбой на нём).
      if(!r.ok) throw new Error(`сервер отклонил удаление (HTTP ${r.status})`);
      delete COMMENTS[sellerArticle];
    }else{
      // on_conflict=article_id ОБЯЗАТЕЛЕН: Prefer: resolution=merge-duplicates без него
      // нацеливается на PRIMARY KEY (id), которого в теле запроса нет — правка УЖЕ
      // существующего комментария превращалась в plain INSERT и билась об отдельное
      // UNIQUE(article_id) -> 409 "duplicate key". Первый комментарий на артикул всегда
      // сохранялся (insert в пустую таблицу), а вот его правка — никогда. Подтверждено
      // прямым воспроизведением того же запроса (09.09.2026).
      const r=await fetch(`${SB_URL}/rest/v1/article_comments?on_conflict=article_id`,{
        method:'POST',
        headers:{'apikey':SB_ANON,'Authorization':`Bearer ${authToken()}`,'Content-Type':'application/json',
                 'Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify({article_id:articleId,comment:text.trim(),updated_at:new Date().toISOString()}),
      });
      if(!r.ok) throw new Error(`сервер отклонил сохранение (HTTP ${r.status})`);
      COMMENTS[sellerArticle]={comment:text.trim(),article_id:articleId};
    }
  }catch(e){
    // Показываем реальную ошибку и НЕ трогаем COMMENTS — следующий render() откатит
    // поле к последнему подтверждённо сохранённому значению, а не к тому, что человек
    // только что напечатал (честно показывает, что правка потерялась, а не притворяется).
    alert('Комментарий НЕ сохранён: '+e.message+'\nПопробуйте ещё раз.');
  }
  render();
}

// Проверяет, должен ли артикул отображаться в указанном месяце (CYEAR/CMONTH)
function isArticleVisible(art){
  // 1. Ручное скрытие: скрываем если текущий месяц ПОСЛЕ last_visible_month
  const rule=VIS_RULES[art.name];
  if(rule){
    const ly=rule.last_visible_year, lm=rule.last_visible_month;
    if(CYEAR>ly||(CYEAR===ly&&CMONTH>lm)) return false;
  }
  // 2. Авто-скрытие: нет заказов за весь просматриваемый месяц И нет плана —
  // если план стоит (даже при 0 факте — это и есть сигнал "не продаём то,
  // что запланировали"), артикул всё равно должен быть виден. 24.09.2026.
  const totalOrd=Object.values(art.days).reduce((s,d)=>s+(d.ord||0),0);
  const hasPlan=(art.plan_ord||0)>0||(art.plan_buy||0)>0||(art.plan_rev||0)>0;
  if(totalOrd===0&&!hasPlan) return false;
  return true;
}

async function loadAvailableMonths(mp){
  const mp_db=MP_DB[mp]||mp;
  // Supabase REST жёстко режет ЛЮБОЙ ответ до 1000 строк на сервере (PostgREST
  // db-max-rows) — параметр limit=... в URL его НЕ переопределяет. Реальный баг:
  // у OZON под 1000 строк (по датам, article-в-день) — это всего 3-4 последних
  // дня, до прошлых месяцев список физически не доходил (селектор показывал
  // только сентябрь). Раньше пробовали поднять limit — не помогло, кэп серверный.
  // Фикс: постранично собираем даты через order=date.desc + Range, пока не
  // упрёмся в конец данных или в разумный потолок страниц.
  const seen=new Set();
  const months=[];
  let offset=0;
  const PAGE=1000, MAX_PAGES=40;
  for(let page=0; page<MAX_PAGES; page++){
    const url=`${SB_URL}/rest/v1/v_daily_dashboard?marketplace=eq.${mp_db}&select=date&order=date.desc`;
    const r=await fetch(url,{headers:{'apikey':SB_ANON,'Authorization':`Bearer ${SB_ANON}`,'Range':`${offset}-${offset+PAGE-1}`}});
    if(!r.ok)break;
    const data=await r.json();
    if(!data||!data.length)break;
    for(const row of data){
      const d=new Date(row.date+'T00:00:00');
      const key=`${d.getFullYear()}-${d.getMonth()+1}`;
      if(!seen.has(key)){seen.add(key);months.push({year:d.getFullYear(),month:d.getMonth()+1});}
    }
    if(data.length<PAGE)break; // дошли до конца данных
    offset+=PAGE;
  }
  return months;
}

// ─── Data transform ───────────────────────────────────────────
function buildDays(rows){
  const dates=[...new Set(rows.map(r=>r.date))].sort();
  return dates.map(date=>{
    const d=new Date(date+'T00:00:00');
    const dd=String(d.getDate()).padStart(2,'0');
    const dow=d.getDay();
    const off=false; // маркетплейсы работают 7 дней в неделю
    const firstDow=new Date(d.getFullYear(),d.getMonth(),1).getDay();
    const shifted=(firstDow+6)%7;
    const wk=Math.ceil((d.getDate()+shifted)/7);
    return{d:dd,wd:WD_RU[dow],off,wk};
  });
}

// WB фото строится из nmId без API-запросов
function wbPhotoUrl(nmId){
  if(!nmId)return null;
  const n=parseInt(nmId);
  if(!n)return null;
  const vol=Math.floor(n/100000);
  const part=Math.floor(n/1000);
  let b=18;
  if(vol<=143)b=1;else if(vol<=287)b=2;else if(vol<=431)b=3;
  else if(vol<=719)b=4;else if(vol<=1007)b=5;else if(vol<=1061)b=6;
  else if(vol<=1115)b=7;else if(vol<=1169)b=8;else if(vol<=1313)b=9;
  else if(vol<=1601)b=10;else if(vol<=1655)b=11;else if(vol<=1919)b=12;
  else if(vol<=2045)b=13;else if(vol<=2189)b=14;else if(vol<=2405)b=15;
  else if(vol<=2621)b=16;else if(vol<=2837)b=17;
  return`https://basket-${String(b).padStart(2,'0')}.wbbasket.ru/vol${vol}/part${part}/${n}/images/small/1.webp`;
}

function buildArticles(rows){
  const map={};
  for(const r of rows){
    const k=r.seller_article;
    if(!map[k])map[k]={
      name:k,cat:r.category||'',days:{},
      marketplace_id:r.marketplace_id||null,
      photo_url:r.photo_url||null,
      plan_ord:r.plan_orders_qty||0,
      plan_buy:r.plan_buyouts_qty||0,
      plan_rev:parseFloat(r.plan_revenue)||0,
      plan_drr:parseFloat(r.plan_drr)||0,
      plan_spend:parseFloat(r.plan_spend)||0,
      plan_vc:parseFloat(r.plan_variable_cost)||0,
      plan_fc:parseFloat(r.plan_fixed_cost)||0,
      // %, 0-100 — требует migration_plan_pct_fields.sql (добавляет эти 3 поля
      // во вьюху v_daily_dashboard); до применения миграции будут просто 0/undefined.
      plan_comm_pct:parseFloat(r.plan_commission_pct)||0,
      plan_logi_pct:parseFloat(r.plan_logistics_pct)||0,
      plan_stor_pct:parseFloat(r.plan_storage_pct)||0,
      commission_sum:parseFloat(r.commission_sum)||0,
      commission_pct:parseFloat(r.commission_pct)||0,
      acquiring_sum:parseFloat(r.acquiring_sum)||0,
      logistics_sum:parseFloat(r.logistics_sum)||0,
      ft_gross_rev:parseFloat(r.ft_gross_rev)||0,
      cogs:parseFloat(r.cogs)||0,
    };
    const dd=r.date.slice(8,10);
    map[k].days[dd]={
      // "Заказы" — ВАЛОВОЕ число (активные + отменённые), как в отчёте "по данным
      // поставщика" WB ("Заказано, шт"). orders_qty уже само по себе валовое —
      // и из API (fetch_wb_api.py считает отменённые тоже), и из файла supplier-goods
      // (там валовое по определению) — cancels_qty НЕ прибавляем, это подмножество,
      // уже включённое в orders_qty, а не отдельная добавка.
      ord:r.orders_qty||0,
      // sls/rev — ТОЛЬКО подтверждённые продажи (по financial_transactions, за вычетом
      // возвратов), не dm.buyouts_qty/sum (органика+реклама из воронки/API) — тот может
      // показывать выкуп раньше, чем появится финансовая проводка по нему, и тогда
      // "Продажи"/"Выручка"/ЧП на дашборде показывали суммы без единого рубля расходов
      // рядом. Правило: не может быть продажи без расходов.
      sls:r.confirmed_qty||0,
      rev:parseFloat(r.confirmed_sum)||0,
      ret:parseFloat(r.returned_sum)||0, // возврат ОТДЕЛЬНО, со знаком минус — иначе тонет внутри rev
      drr:parseFloat(r.drr)||0,
      spend:parseFloat(r.spend)||0,
      // ad_shows (не dm.shows!) — показы именно от рекламы (ad_stats), в паре с clicks/ctr,
      // которые тоже из ad_stats. dm.shows — органическая воронка (переходы в карточку,
      // органика+реклама вместе) обновляется только руками из файла "Воронка продаж" и
      // может протухать месяцами — смешивать её с рекламными кликами в одной метрике
      // (как было раньше) давало бессмысленный CTR.
      shows:r.ad_shows||0,
      clicks:r.clicks||0,
      cart:r.cart||0, // dm.cart — корзина ИТОГО (органика+реклама), из воронки
      ctr:parseFloat(r.ctr)||0,
      adOrders:r.ad_orders_qty||0, // заказы, атрибутированные рекламе (ad_stats), не путать с ord (весь спрос)
      adCart:r.ad_cart||0,         // корзина ТОЛЬКО от рекламы (ad_stats)
      totalShows:r.shows||0,       // dm.shows — показы ИТОГО (органика+реклама), из воронки
      cancelled:r.cancels_qty||0,  // dm.cancels_qty — отменённые заказы (WB API isCancel ИЛИ воронка,
                                    // см. коммент в fetch_wb_api.py::upsert_daily_metrics про два источника)
      stockQty:r.stock_qty||0,     // остаток на складах на эту дату (stock_snapshots), снэпшот — не поток
      comm:parseFloat(r.commission_day)||0,
      logi:parseFloat(r.logistics_day)||0,
      acq:parseFloat(r.acquiring_day)||0,
      ftrev:parseFloat(r.ft_rev_day)||0,
      profit:0,
    };
  }
  return Object.values(map);
}

// Цветомодель — тот же приём, что colorModel() в rnp_finance.html (группировка по
// артикулу без хвостового размера): "T55поло серый-бордовый/44" -> "T55поло серый-бордовый".
function colorModel(sellerArticle){
  const idx=sellerArticle.lastIndexOf('/');
  if(idx<0) return sellerArticle;
  const size=sellerArticle.slice(idx+1).trim();
  if(size.length<=6) return sellerArticle.slice(0,idx).trim();
  return sellerArticle;
}

function buildKPI(rows,mp){
  const s =f=>rows.reduce((a,r)=>a+(parseFloat(r[f])||0),0);
  const si=f=>rows.reduce((a,r)=>a+(parseInt(r[f])||0),0);

  // ── Факт ──
  const ordQty    = si('orders_qty');
  // buyQty/revenue — ТОЛЬКО подтверждённые продажи (financial_transactions, за вычетом
  // возвратов), не dm.buyouts_qty/sum — см. коммент у map[k].days[dd] выше: не может
  // быть продажи без расходов рядом с ней.
  const buyQty    = si('confirmed_qty');
  const revenue   = s('confirmed_sum');
  const spend     = s('spend');
  const drr       = revenue>0 ? spend/revenue*100 : 0;
  const buyoutPct = ordQty>0  ? buyQty/ordQty*100 : 0;
  // Себестоимость: vc и fc одинаковы для всех дней одного артикула-месяца,
  // поэтому sum((vc+fc) × confirmed_qty по дням) = (vc+fc) × total_buyQty — корректно
  const cogs = rows.reduce((a,r)=>{
    const vc=parseFloat(r.plan_variable_cost)||0;
    const fc=parseFloat(r.plan_fixed_cost)||0;
    return a+(vc+fc)*(parseInt(r.confirmed_qty)||0);
  },0);
  // ЧП по реальной себестоимости (article_costs)
  const realCogs=rows.reduce((a,r)=>a+(parseFloat(r.cogs)||0)*(parseInt(r.confirmed_qty)||0),0);
  // Комиссия+эквайринг+логистика — месячный агрегат, дедуп по артикулу
  const seenNp=new Set();
  let totalComm=0,totalAcq=0,totalLogi=0,totalGross=0;
  for(const r of rows){
    if(!seenNp.has(r.seller_article)){
      seenNp.add(r.seller_article);
      totalComm+=parseFloat(r.commission_sum)||0;
      totalAcq +=parseFloat(r.acquiring_sum)||0;
      totalLogi+=parseFloat(r.logistics_sum)||0;
      totalGross+=parseFloat(r.ft_gross_rev)||0;
    }
  }
  const npRatio=totalGross>0?Math.min(revenue/totalGross,1):1;
  const np=realCogs>0&&revenue>0?revenue-realCogs-spend-(totalComm+totalAcq+totalLogi)*npRatio:null;
  const npPct=np!==null&&revenue>0?(np/revenue*100).toFixed(1):null;

  // Логистика по кабинету, % от выручки (месячный агрегат, та же дедупликация по
  // артикулу, что totalLogi выше — logistics_sum уже месячный, не дневной).
  const logiPct = revenue>0 ? (totalLogi*npRatio)/revenue*100 : 0;

  // Выкупаемость + план по категориям и цветомоделям — детализация под
  // карточкой "Выкупаемость" (та же формула buyQty/ordQty для факта, что и
  // общий итог выше, но по группам). 24.09.2026: добавлен план (Заказы/
  // Продажи/Выручка) — раньше в этой разбивке был только факт, план видели
  // только на общем итоге по кабинету или на отдельном артикуле, не по
  // категории/цветомодели, хотя именно так аналитику и хотели смотреть.
  // Факт суммируем по ВСЕМ строкам группы (каждая строка — день, сумма по
  // дням = факт за период). План — flat-значение, повторяется на КАЖДОЙ
  // дневной строке одного артикула, поэтому считаем его отдельным проходом
  // с dedup по seller_article (иначе план умножился бы на число дней).
  const groupBuyout = keyFn => {
    const g = {};
    for (const r of rows) {
      const k = keyFn(r) || '(без категории)';
      if (!g[k]) g[k] = {ord:0, buy:0, rev:0};
      g[k].ord += parseInt(r.orders_qty)||0;
      g[k].buy += parseInt(r.confirmed_qty)||0;
      g[k].rev += parseFloat(r.confirmed_sum)||0;
    }
    const seenPlan = new Set();
    for (const r of rows) {
      if (seenPlan.has(r.seller_article)) continue;
      seenPlan.add(r.seller_article);
      const k = keyFn(r) || '(без категории)';
      if (!g[k]) continue; // группа без единой фактической строки — план ей тоже не покажем
      g[k].planOrd = (g[k].planOrd||0) + (parseInt(r.plan_orders_qty)||0);
      g[k].planBuy = (g[k].planBuy||0) + (parseInt(r.plan_buyouts_qty)||0);
      g[k].planRev = (g[k].planRev||0) + (parseFloat(r.plan_revenue)||0);
    }
    return Object.entries(g)
      .map(([name,v])=>({name, ord:v.ord, buy:v.buy, rev:v.rev,
        pct: v.ord>0 ? v.buy/v.ord*100 : 0,
        planOrd:v.planOrd||0, planBuy:v.planBuy||0, planRev:v.planRev||0}))
      .filter(x=>x.ord>0||x.buy>0)
      .sort((a,b)=>b.ord-a.ord);
  };
  const buyoutByCat   = groupBuyout(r=>r.category);
  const buyoutByModel = groupBuyout(r=>colorModel(r.seller_article));

  // ── План (дедупликация по артикулу: план одинаков для всех дней месяца) ──
  const seen=new Set();
  let planOrd=0, planBuy=0, planRev=0;
  for(const r of rows){
    if(!seen.has(r.seller_article)){
      seen.add(r.seller_article);
      planOrd += parseInt(r.plan_orders_qty)  ||0;
      planBuy += parseInt(r.plan_buyouts_qty) ||0;
      planRev += parseFloat(r.plan_revenue)   ||0;
    }
  }

  // Планы ДРР и Расходы
  let planDrr=0, planSpend=0;
  const seen2=new Set();
  for(const r of rows){
    if(!seen2.has(r.seller_article)){
      seen2.add(r.seller_article);
      planDrr   += parseFloat(r.plan_drr)  ||0;
      planSpend += parseFloat(r.plan_spend)||0;
    }
  }
  // Средний плановый ДРР (взвешенный по кол-ву артикулов с планом)
  const artWithDrrPlan=rows.filter((r,i,a)=>a.findIndex(x=>x.seller_article===r.seller_article)===i&&parseFloat(r.plan_drr)>0).length;
  const avgPlanDrr = artWithDrrPlan>0 ? planDrr/artWithDrrPlan : 0;

  // План ЧП и Логистика % — из %% плана (plan_commission_pct/plan_logistics_pct,
  // migration_plan_pct_fields.sql) × план-выручка, та же формула, что уже у
  // строки артикула/категории (см. mkPR-блок и catPlanComm/catPlanLogi выше).
  // Дедуп по seller_article — план flat на весь месяц, повторяется на каждой
  // дневной строке, иначе умножился бы на число дней. 25.09.2026, по прямой
  // просьбе пользователя — раньше эти 2 карточки в kstrip всегда были "нет
  // плана", хотя данные для расчёта уже есть.
  const seen3=new Set();
  let planComm=0, planLogi=0, planVcTotal=0;
  for(const r of rows){
    if(seen3.has(r.seller_article))continue;
    seen3.add(r.seller_article);
    const pr=parseFloat(r.plan_revenue)||0;
    if(pr>0&&parseFloat(r.plan_commission_pct)>0)planComm+=pr*parseFloat(r.plan_commission_pct)/100;
    if(pr>0&&parseFloat(r.plan_logistics_pct)>0)planLogi+=pr*parseFloat(r.plan_logistics_pct)/100;
    planVcTotal+=(parseFloat(r.plan_variable_cost)||0)*(parseInt(r.plan_buyouts_qty)||0);
  }
  const planNp = planRev>0 ? planRev-planVcTotal-planSpend-planComm-planLogi : null;
  const planNpPct = planNp!==null&&planRev>0 ? (planNp/planRev*100).toFixed(1) : null;
  const planLogiPct = planRev>0 ? (planLogi/planRev*100) : 0;

  // Хелпер: % выполнения (null если плана нет)
  const pc=(fact,plan)=>plan>0?Math.round(fact/plan*100):null;
  // Абсолютное отклонение — только если есть план
  const dev=(fact,plan)=>plan>0?(fact-plan):null;
  // Форматирование отклонения
  const fdev=(d,fmt)=>d===null?null:(d>=0?'+':'')+fmt(d);

  return [
    {l:'Заказы',       v:String(ordQty),          plan:planOrd>0?String(planOrd):null,        pct:pc(ordQty,planOrd),   dev:fdev(dev(ordQty,planOrd),v=>String(Math.round(v))),   inv:false},
    {l:'Продажи',      v:String(buyQty),           plan:planBuy>0?String(planBuy):null,        pct:pc(buyQty,planBuy),   dev:fdev(dev(buyQty,planBuy),v=>String(Math.round(v))),   inv:false},
    {l:'Выкупаемость', v:buyoutPct.toFixed(1)+'%', plan:null,                                  pct:null,                 dev:null,                                                  inv:false,
     expand:{byCat:buyoutByCat, byModel:buyoutByModel}},
    {l:'Выручка',      v:Nf(revenue),              plan:planRev>0?Nf(planRev):null,            pct:pc(revenue,planRev),  dev:fdev(dev(revenue,planRev),v=>Nf(Math.abs(v))+(v<0?'':'')), inv:false},
    {l:'Себестоимость',v:cogs>0?Nf(cogs)+'₽':'—', plan:null,                                  pct:null,                 dev:null,                                                  inv:false},
    {l:'ЧП',           v:np!==null?Nf(np)+'₽'+(npPct?' ('+npPct+'%)':''):'—',
     plan:planNp!==null?Nf(planNp)+'₽':null,
     pct:(np!==null&&planNp>0)?Math.round(np/planNp*100):null,
     dev:(np!==null&&planNp!==null&&planNp>0)?fdev(dev(np,planNp),v=>Nf(Math.abs(v))+'₽'):null, inv:false},
    {l:'ДРР %',        v:drr.toFixed(1)+'%',       plan:avgPlanDrr>0?avgPlanDrr.toFixed(1)+'%':null, pct:avgPlanDrr>0?Math.round(drr/avgPlanDrr*100):null, dev:avgPlanDrr>0?fdev(dev(drr,avgPlanDrr),v=>Math.abs(v).toFixed(1)+'%'):null, inv:true},
    {l:'Логистика %',  v:logiPct.toFixed(1)+'%',
     plan:planLogiPct>0?planLogiPct.toFixed(1)+'%':null,
     pct:planLogiPct>0?Math.round(logiPct/planLogiPct*100):null,
     dev:planLogiPct>0?fdev(dev(logiPct,planLogiPct),v=>Math.abs(v).toFixed(1)+'%'):null, inv:true},
  ];
}

async function reloadData(){
  showLoading(true);
  try {
    const rows=await loadMonthData(CMP,CYEAR,CMONTH);
    console.log(`reloadData: got ${rows.length} rows`);
    DATA[CMP]=rows.length?{
      color:CMP==='wb'?'#CB11AB':'#005bff',
      days:buildDays(rows),
      kpi:buildKPI(rows,CMP),
      articles:buildArticles(rows),
    }:{color:CMP==='wb'?'#CB11AB':'#005bff',days:[],kpi:[],articles:[]};
    render();
  } catch(e) {
    console.error('reloadData error:', e);
    document.getElementById('tbl-container').innerHTML=
      `<p style="padding:20px;color:#e24b4a;font-size:12px">Ошибка загрузки: ${e.message}</p>`;
  } finally {
    showLoading(false);
  }
}

async function populateMonthSel(){
  const months=await loadAvailableMonths(CMP);
  const sel=document.getElementById('month-sel');
  sel.innerHTML='';
  if(!months.length){sel.innerHTML='<option>Нет данных</option>';return;}
  months.forEach(m=>{
    const o=document.createElement('option');
    o.value=`${m.year}-${m.month}`;
    o.textContent=`${MONTHS_RU[m.month]} ${m.year}`;
    if(m.year===CYEAR&&m.month===CMONTH)o.selected=true;
    sel.appendChild(o);
  });
  if(!months.find(m=>m.year===CYEAR&&m.month===CMONTH)){
    CYEAR=months[0].year;CMONTH=months[0].month;
    sel.value=`${CYEAR}-${CMONTH}`;
  }
}

function getV(art,day,metric){
  const d=art.days[day.d];
  if(!d||day.off)return 0;
  if(metric==='orders') return d.ord;
  if(metric==='sales')  return d.sls;
  if(metric==='revenue')return d.rev;
  if(metric==='drr')    return d.rev>0?parseFloat((d.spend/d.rev*100).toFixed(1)):0;
  if(metric==='spend')  return d.spend;
  if(metric==='shows')  return d.shows;
  if(metric==='clicks') return d.clicks;
  if(metric==='cart')   return d.cart;
  if(metric==='adOrders')return d.adOrders;
  // d.ctr уже посчитан в БД как AVG(ad_stats.ctr) — настоящий CTR по рекламе,
  // не пересчитываем его тут через d.clicks/d.shows (это давало рассинхрон, когда
  // shows одно время тянулись из органической воронки, а clicks — из ad_stats).
  if(metric==='ctr')    return d.ctr||0;
  // Комиссия и логистика привязаны к ПРОДАЖЕ (выкупу), не к заказу — без выкупа в этот
  // день списаний по факту не было, даже если в d.comm/d.logi что-то попало из файла.
  if(metric==='comm')   return d.sls>0?d.comm:0;
  if(metric==='commPct')return d.sls>0&&d.ftrev>0?parseFloat((d.comm/d.ftrev*100).toFixed(1)):0;
  if(metric==='logi')   return d.sls>0?d.logi:0;
  if(metric==='logiPct')return d.sls>0&&d.ftrev>0?parseFloat((d.logi/d.ftrev*100).toFixed(1)):0;
  // Эквайринг — тот же принцип, что комиссия/логистика: привязан к продаже, не к заказу.
  if(metric==='acq')    return d.sls>0?(d.acq||0):0;
  // ЧП% дня = полная формула (выручка−себестоимость−реклама−комиссия−логистика−эквайринг)/выручка,
  // НЕ упрощённая (выручка−реклама)/выручка — та давала фейковые 100% в дни без рекламы
  // (нашли на реальном кейсе: манишка, 0 руб. рекламы в тот день -> старая формула = 100%).
  // Себестоимость точная: art.cogs (₽/шт, из article_costs) × d.sls (точное число продаж дня).
  if(metric==='profit'){
    if(!(d.rev>0)||!(art.cogs>0))return 0;
    const cogs=art.cogs*d.sls;
    const platform=d.sls>0?(d.comm+d.logi+(d.acq||0)):0;
    const np=d.rev-cogs-d.spend-platform;
    return parseFloat((np/d.rev*100).toFixed(1));
  }
  return 0;
}
function fmtV(v,metric){
  if(v===0)return'—';
  if(metric==='drr'||metric==='ctr'||metric==='profit'||metric==='commPct'||metric==='logiPct')return v.toFixed(1)+'%';
  if(metric==='revenue'||metric==='spend'||metric==='comm'||metric==='logi'||metric==='acq')return Nf(v)+'₽';
  if(metric==='shows')return Fk(v);
  if(metric==='sales')return String(v);
  return String(v);
}
// cogsPerUnit (art.cogs, ₽/шт) даёт ТОЧНУЮ себестоимость дня = cogsPerUnit×sls — без
// прорейтинга по доле выручки (раньше прорейтинг от месячного ft_gross_rev при выбранной
// неделе давал заниженную себестоимость и фейковые ~100% ЧП).
//
// Комиссия/логистика/эквайринг/штраф/возврат НЕ гейтим по sls>0 (было раньше, убрано
// 10.08.2026) — платформа фиксирует их той датой, когда сама провела операцию, а не датой
// нового выкупа: возврат СТАРОЙ продажи, логистика без привязки к продаже в этот день и т.п.
// показываются на СВОЮ дату, как и расход на рекламу (spend), который никогда не гейтился.
// Гейт по sls>0 занулял реальные расходы в дни без нового выкупа — та же природа бага,
// что "комиссия без продажи" (см. историю с T55поло лайм-айвори/серый-бордовый).
function gateDay(d,cogsPerUnit,monthlyRev){
  if(!d)return null;
  const sls=d.sls||0;
  return{ord:d.ord||0,sls,rev:d.rev||0,ret:d.ret||0,spend:d.spend||0,
    comm:d.comm||0,logi:d.logi||0,acq:d.acq||0,
    cogs:(cogsPerUnit>0)?cogsPerUnit*sls:0,
    ftrev:d.ftrev||0,
    // Месячная выручка артикула — fallback-база для %, когда за САМ день выручки нет
    // (комиссия/логистика теперь показываются вне зависимости от дневной продажи, см.
    // коммент выше — но % от нуля не посчитать, нужна какая-то ненулевая база).
    mrev:monthlyRev||0,
    // Блок "Реклама" (ad_stats, только рекламный трафик)
    adShows:d.shows||0,adClicks:d.clicks||0,adCart:d.adCart||0,adOrders:d.adOrders||0,
    // Блок "Итого" (daily_metrics, органика+реклама вместе, из воронки)
    totalShows:d.totalShows||0,totalCart:d.cart||0,totalOrders:d.ord||0,
    cancelled:d.cancelled||0,
    // Остаток на складах — снэпшот НА эту дату, не поток за день (см. коммент у METRIC_ROWS
    // про cumMode:'last' — суммировать остатки по дням периода бессмысленно).
    stockQty:d.stockQty||0};
}
// Компактный блок со всеми метриками за один день (режим CM==='all').
// Показываем ВСЕ метрики всегда, без данных — "—" (не скрываем строку).
// ЧП = выручка − себестоимость − реклама − комиссия − логистика − эквайринг — все точные
// по дню (o.cogs/o.acq/o.comm/o.logi уже посчитаны вызывающим кодом на основе gateDay,
// без прорейтинга). Без себестоимости (o.cogs=0) — ЧП "—", а не фейковые 100% от
// (выручка−реклама)/выручка, как было раньше (нашли на реальном кейсе: день без рекламы
// показывал ЧП 100% при реальной марже ~2-10%).
function dayAllHTML(o){
  const d=o||{};
  const ord=d.ord||0,sls=d.sls||0,rev=d.rev||0,ret=d.ret||0,spend=d.spend||0,comm=d.comm||0,logi=d.logi||0,
        acq=d.acq||0,cogs=d.cogs||0,ftrev=d.ftrev||0;
  const adShows=d.adShows||0,adClicks=d.adClicks||0,adCart=d.adCart||0,adOrders=d.adOrders||0;
  const totalShows=d.totalShows||0,totalCart=d.totalCart||0,totalOrders=d.totalOrders||0,cancelled=d.cancelled||0;
  const avg=sls>0?Nf(rev/sls)+'₽':'—';
  let np=null,profitPct=null;
  if(rev>0&&cogs>0){
    np=rev-cogs-spend-comm-logi-acq;
    profitPct=np/rev*100;
  }
  // База для % = выручка ЗА ЭТОТ ДЕНЬ, а если её нет (комиссия/лог/штраф теперь могут
  // показываться и в дни без новой продажи, см. коммент у gateDay) — берём месячную
  // выручку артикула (mrev) как fallback, чтобы % не пропадал везде, где есть сумма в ₽.
  const base=ftrev>0?ftrev:(d.mrev||0);
  const pct=(v)=>base>0&&v>0?(v/base*100).toFixed(1)+'%':null;
  const drrPct=pct(spend);
  const commPct=pct(comm);
  const logiPct=pct(logi);
  const acqPct=pct(acq);
  const retPct=base>0&&ret!==0?(Math.abs(ret)/base*100).toFixed(1)+'%':null;
  const npCls=profitPct===null?'':profitPct>=0?'pv':'nv';
  const npPctBadge=profitPct===null?'':`<span class="pr-pct ${npCls}" style="background:${profitPct>=0?'var(--color-background-success, #e6f4ea)':'var(--color-background-error, #fce8e6)'};color:${profitPct>=0?'var(--color-text-success, #137333)':'var(--color-text-error, #c5221f)'}">${profitPct.toFixed(1)}%</span>`;
  const warn='style="background:var(--color-background-warning);color:var(--color-text-warning)"';
  return '<div class="pr-wrap day-all">'
    +`<div class="pr-row"><span class="pr-lbl">Зак</span><span class="pr-fact">${Nf(ord)}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Прод</span><span class="pr-fact">${Nf(sls)}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Выр</span><span class="pr-fact">${rev>0?Nf(rev)+'₽':'—'}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Возврат</span><span class="pr-fact nv">${ret!==0?Nf(ret)+'₽':'—'}</span>${retPct?`<span class="pr-pct" ${warn}>${retPct}</span>`:''}</div>`
    +`<div class="pr-row"><span class="pr-lbl">Чек</span><span class="pr-fact">${avg}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">ЧП</span><span class="pr-fact ${npCls}">${np===null?'—':Nf(np)+'₽'}</span>${npPctBadge}</div>`
    +`<div class="pr-row"><span class="pr-lbl">ДРР</span><span class="pr-fact">${spend>0?Nf(spend)+'₽':'—'}</span>${drrPct?`<span class="pr-pct" ${warn}>${drrPct}</span>`:''}</div>`
    +`<div class="pr-row"><span class="pr-lbl">Ком</span><span class="pr-fact">${comm>0?Nf(comm)+'₽':'—'}</span>${commPct?`<span class="pr-pct" ${warn}>${commPct}</span>`:''}</div>`

    +`<div class="pr-row"><span class="pr-lbl">Лог</span><span class="pr-fact">${logi>0?Nf(logi)+'₽':'—'}</span>${logiPct?`<span class="pr-pct" ${warn}>${logiPct}</span>`:''}</div>`
    +`<div class="pr-sep">Реклама</div>`
    +`<div class="pr-row"><span class="pr-lbl">Показы</span><span class="pr-fact">${adShows>0?Fk(adShows):'—'}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Клики</span><span class="pr-fact">${adClicks>0?Nf(adClicks):'—'}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Корзина</span><span class="pr-fact">${adCart>0?Nf(adCart):'—'}</span></div>`
    +`<div class="pr-row"><span class="pr-lbl">Заказы</span><span class="pr-fact">${adOrders>0?Nf(adOrders):'—'}</span></div>`
