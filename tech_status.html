<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тех лист — РНП</title>
<style>
:root{
  --bg:#0f1115;--card:#171a21;--border:#262b36;--text:#e6e9ef;--text2:#9aa3b2;
  --ok:#3fb668;--warn:#e0a83c;--err:#e05c5c;--accent:#4f8cff;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f6f8;--card:#fff;--border:#e2e5ea;--text:#1a1d23;--text2:#6b7280;}
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,'Segoe UI',Roboto,sans-serif;padding:20px}
.w{max-width:1100px;margin:0 auto}
h1{font-size:18px;margin-bottom:4px}
.sub{color:var(--text2);font-size:12px;margin-bottom:20px}
h2{font-size:14px;margin:24px 0 10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{color:var(--text2);text-align:left;font-weight:500;padding:4px 10px 6px 0;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:4px 10px 4px 0;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:none}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}
.msg{color:var(--text2);white-space:normal;max-width:340px}
.pill{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;border:1px solid var(--border)}
.gap{color:var(--err);font-weight:600}
.muted{color:var(--text2)}
a.back{color:var(--accent);text-decoration:none;font-size:12px}
.loading{color:var(--text2);padding:30px;text-align:center}
</style>
</head>
<body>
<div class="w">
  <a class="back" href="rnp_v6_live.html">← Дашборд</a>
  <a class="back" href="http://localhost:8792" target="_blank" style="margin-left:14px"
     title="Выдача доступа и импорт файлов (нужен запущенный execution/import_server.py, порт 8792)">
    👤 Выдать доступ
  </a>
  <h1 style="margin-top:8px">🔧 Тех лист</h1>
  <div class="sub">Статус загрузки данных и пропуски. Обновляется при каждом запуске API-скриптов.</div>

  <h2>Пропуски данных (последние 30 дней)</h2>
  <div class="card" id="gaps"><div class="loading">Загрузка…</div></div>

  <h2>Журнал синхронизаций (последние 60 записей)</h2>
  <div class="card" id="log"><div class="loading">Загрузка…</div></div>
</div>

<script>
const SB_URL='https://lxmewaxdkjvpkoaoghxp.supabase.co';
const SB_ANON='sb_publishable_Txyv_RuL8aR6OIACwPH1Hg_bKmqu6FA';

async function sbGet(path){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:{
    'apikey':SB_ANON,'Authorization':`Bearer ${SB_ANON}`}});
  if(!r.ok)throw new Error(`${r.status}: ${await r.text()}`);
  return r.json();
}

const STEP_RU={orders:'Заказы',buyouts:'Выкупы',ads:'Реклама',stocks:'Остатки',
               finance:'Финансы (детализация)',analytics:'Заказы/выручка'};
const ST_ICON={ok:'<span class="ok">✓ ok</span>',warn:'<span class="warn">⚠ warn</span>',
               error:'<span class="err">✗ error</span>'};

function fmtDT(s){
  const d=new Date(s);
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+
         d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}

async function loadLog(){
  try{
    const rows=await sbGet('sync_log?order=run_at.desc&limit=60');
    if(!rows.length){
      document.getElementById('log').innerHTML='<span class="muted">Журнал пуст — скрипты ещё не запускались после создания sync_log.</span>';
      return;
    }
    let h='<table><tr><th>Когда</th><th>МП</th><th>Шаг</th><th>Статус</th><th>Строк</th><th>Пропущено</th><th>Период</th><th>Сообщение</th></tr>';
    for(const r of rows){
      h+=`<tr><td>${fmtDT(r.run_at)}</td>`+
         `<td>${r.marketplace.toUpperCase()}</td>`+
         `<td>${STEP_RU[r.step]||r.step}</td>`+
         `<td>${ST_ICON[r.status]||r.status}</td>`+
         `<td>${r.rows_count??''}</td>`+
         `<td>${r.skipped?`<span class="warn">${r.skipped}</span>`:''}</td>`+
         `<td class="muted">${r.date_from?`${r.date_from}…${r.date_to||''}`:''}</td>`+
         `<td class="msg">${r.message||''}</td></tr>`;
    }
    document.getElementById('log').innerHTML=h+'</table>';
  }catch(e){
    document.getElementById('log').innerHTML=`<span class="err">Ошибка: ${e.message}</span>`;
  }
}

function dateRange(days){
  const out=[];const now=new Date();
  for(let i=days;i>=1;i--){
    const d=new Date(now);d.setDate(d.getDate()-i);
    out.push(d.toISOString().slice(0,10));
  }
  return out;
}

function gapCell(missing){
  if(!missing.length)return'<span class="ok">✓ нет пропусков</span>';
  const short=missing.map(d=>d.slice(8,10)+'.'+d.slice(5,7));
  const shown=short.slice(0,8).join(', ');
  return`<span class="gap">${missing.length} дн:</span> <span class="msg">${shown}${short.length>8?'…':''}</span>`;
}

async function loadGaps(){
  try{
    const days=dateRange(30);
    const from=days[0];
    // daily_metrics и реклама — из v_daily_dashboard
    const dm=await sbGet(`v_daily_dashboard?select=date,marketplace,orders_qty,spend&date=gte.${from}&limit=20000`);
    // финансы WB — из financial_transactions
    let fin=[];
    try{fin=await sbGet(`financial_transactions?select=date&date=gte.${from}&limit=20000`);}catch(e){}

    const has={wb_dm:new Set(),oz_dm:new Set(),wb_ads:new Set(),oz_ads:new Set(),wb_fin:new Set()};
    for(const r of dm){
      const mp=r.marketplace;
      if(parseInt(r.orders_qty)>0) has[mp==='wb'?'wb_dm':'oz_dm'].add(r.date);
      if(parseFloat(r.spend)>0)    has[mp==='wb'?'wb_ads':'oz_ads'].add(r.date);
    }
    for(const r of fin) has.wb_fin.add(r.date);

    // Вчера и раньше данные должны быть каждый день (заказы могут быть 0 в мёртвый день,
    // но 30 дней подряд нулей — это пропуск загрузки, помечаем как пропуск при полном отсутствии строк)
    const rows=[
      ['WB — заказы/выручка', days.filter(d=>!has.wb_dm.has(d))],
      ['WB — реклама (расход)', days.filter(d=>!has.wb_ads.has(d))],
      ['WB — финансовая детализация', days.filter(d=>!has.wb_fin.has(d))],
      ['OZON — заказы/выручка', days.filter(d=>!has.oz_dm.has(d))],
      ['OZON — реклама (расход)', days.filter(d=>!has.oz_ads.has(d))],
    ];
    let h='<table><tr><th>Источник</th><th>Пропуски</th></tr>';
    for(const [name,missing] of rows)
      h+=`<tr><td>${name}</td><td>${gapCell(missing)}</td></tr>`;
    h+='</table><div class="muted" style="margin-top:8px;font-size:11px">Пропуск = день без единой строки данных. Дни без продаж/рекламы тоже попадают сюда — сверяйтесь с журналом ниже: если статус ok, данных в тот день просто не было.</div>';
    document.getElementById('gaps').innerHTML=h;
  }catch(e){
    document.getElementById('gaps').innerHTML=`<span class="err">Ошибка: ${e.message}</span>`;
  }
}

loadLog();loadGaps();
</script>
</body>
</html>
